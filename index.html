<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《江湖试炼》— 试玩原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* 《江湖试炼》视觉规范 · 来自 ui-wireframes/tokens.css */
  :root {
    --paper: #f3ead8;
    --paper-dark: #e6d9c2;
    --ink: #2a2420;
    --ink-muted: #6b5e52;
    --border: #8a7a68;
    --gold: #b8860b;
    --hp: #c44536;
    --hp-bg: #e8d4ce;
    --mp: #3d6b8c;
    --mp-bg: #d4e0e8;
    --encounter: #c44536;
    --obstacle: #5a6b4a;
    --walk: #f7f1e6;
    --player: #2a2420;
    --btn: #e8dcc8;
    --btn-hover: #dccfb8;
    --btn-primary: #5c4033;
    --btn-primary-text: #f3ead8;
    --btn-disabled: #cfc4b4;
    --log-bg: #ebe2d2;
    --cinnabar: #c44536;
    --earth: #efe4d0;
    --earth-bright: #f6efe2;
    --moss: #c5cbb0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Serif SC", "Songti SC", "Source Han Serif SC", serif;
    background:
      linear-gradient(180deg, rgba(22, 16, 12, 0.58) 0%, rgba(12, 9, 7, 0.72) 100%),
      url("assets/bg-mountain-path.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  #app {
    position: relative;
    width: 100%;
    max-width: 720px;
    background: var(--paper);
    padding: 22px 26px 18px;
    border: 2px solid #2a2420;
    box-shadow:
      inset 0 0 0 1px #c9b89a,
      inset 0 0 0 5px var(--paper),
      inset 0 0 0 6px #2a2420,
      0 22px 56px rgba(8, 6, 4, 0.48);
    overflow: hidden;
  }
  #app::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.09;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(42, 36, 32, 0.22) 2px,
        rgba(42, 36, 32, 0.22) 3px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 3px,
        rgba(42, 36, 32, 0.12) 3px,
        rgba(42, 36, 32, 0.12) 4px
      );
  }
  #app > * { position: relative; z-index: 1; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    gap: 12px;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .seal {
    width: 44px;
    height: 44px;
    object-fit: cover;
    transform: rotate(-8deg);
    border: 1px solid rgba(139, 30, 30, 0.45);
    box-shadow: 0 1px 4px rgba(90, 18, 12, 0.25);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
    font-family: inherit;
  }
  .topbar .stats {
    font-size: 13px;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .topbar .stats b { color: var(--gold); }
  .topbar .phase {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: 10px;
  }

  #view { min-height: 360px; }

  /* —— 按钮（tokens） —— */
  .btn {
    background: var(--btn);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn-primary {
    background: var(--btn-primary);
    color: var(--btn-primary-text);
    border-color: var(--btn-primary);
  }
  .btn-primary:hover:not(:disabled) {
    background: #4a3328;
    border-color: #4a3328;
  }
  .btn:disabled {
    background: var(--btn-disabled);
    color: var(--ink-muted);
    cursor: not-allowed;
  }

  /* —— 血条 / 内力条（tokens） —— */
  .bar {
    height: 7px;
    border-radius: 1px;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--hp-bg);
    flex: 1;
  }
  .bar.mp { background: var(--mp-bg); }
  .bar > i {
    display: block;
    height: 100%;
    background: var(--hp);
    transition: width 0.25s;
  }
  .bar.mp > i { background: var(--mp); }

  /* —— 地图格 5×5 —— */
  .cell {
    width: 56px;
    height: 56px;
    font-size: 0;
    border: 1px solid rgba(90, 74, 58, 0.45);
    background: var(--earth);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    user-select: none;
    position: relative;
  }
  .cell.walk {
    background-color: var(--earth);
    background-image: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 6px,
      rgba(140, 110, 70, 0.07) 6px,
      rgba(140, 110, 70, 0.07) 7px
    );
  }
  .cell.obstacle {
    background:
      radial-gradient(ellipse at 50% 80%, rgba(70, 90, 50, 0.18), transparent 60%),
      repeating-linear-gradient(135deg, #c5cbb0 0 3px, #b3bc9c 3px 6px);
    color: var(--obstacle);
  }
  .cell.encounter {
    background:
      radial-gradient(ellipse at center, rgba(196, 69, 54, 0.28), #e8c8bc 70%);
  }
  .cell.encounter.done {
    background: var(--earth);
    opacity: 0.88;
  }
  .cell.player {
    background: var(--paper-dark);
  }
  .cell.walk.adjacent {
    cursor: pointer;
    background-color: var(--earth-bright);
    box-shadow: inset 0 0 0 2px #b8860b;
  }
  .cell.walk.adjacent:hover {
    background-color: #f3e6cf;
  }
  .cell .token {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--ink);
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
  }
  .cell .ico-pine {
    width: 34px;
    height: 40px;
    display: block;
  }
  .cell .ico-lantern {
    width: 22px;
    height: 32px;
    display: block;
  }
  .cell .stamp {
    font-size: 16px;
    font-weight: 700;
    color: #a33028;
    opacity: 0.42;
    border: 1.5px solid #a33028;
    border-radius: 3px;
    padding: 1px 4px;
    transform: rotate(-14deg);
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  /* —— 探索 —— */
  .map-wrap { text-align: center; }
  .map {
    display: grid;
    grid-template-columns: repeat(5, 56px);
    gap: 0;
    margin: 0 auto 12px;
    width: fit-content;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 10px rgba(42, 36, 32, 0.12);
  }
  .hint {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .party-strip {
    text-align: left;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .party-strip h3 {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: 0.2em;
  }
  .party-row {
    display: flex;
    gap: 8px;
  }
  .party-card {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 8px;
    background: var(--paper-dark);
    border: 1px solid var(--border);
    padding: 6px;
  }
  .party-card .port {
    width: 56px;
    height: 75px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .party-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .party-card .pn {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
  }
  .party-card .pn .role {
    font-weight: 400;
    font-size: 11px;
    color: var(--ink-muted);
    margin-left: 2px;
  }
  .party-card .pt {
    color: var(--ink-muted);
    font-size: 10px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 2px 0 4px;
  }
  .party-card .row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  /* —— 战斗 —— */
  .combat { display: flex; flex-direction: column; gap: 10px; }
  .turn {
    font-size: 13px;
    margin-bottom: 2px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.06em;
  }
  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .side h2 {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.18em;
  }
  .unit {
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 6px;
    margin-bottom: 6px;
    cursor: default;
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .unit .port {
    width: 64px;
    height: 86px;
    object-fit: cover;
    object-position: 50% 16%;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .unit-body { flex: 1; min-width: 0; }
  .unit.active { outline: 2px solid var(--cinnabar); outline-offset: 0; }
  .unit.selectable { cursor: pointer; outline: 1px dashed var(--border); }
  .unit.selectable:hover { background: #ddd2bc; }
  .unit.down { opacity: 0.42; filter: grayscale(1); }
  .unit .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .unit .name .role {
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-muted);
    margin-left: 6px;
  }
  .unit .tagline {
    font-size: 10px;
    color: var(--ink-muted);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .unit .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 11px;
    color: var(--ink-muted);
  }
  .unit .row .bar { flex: 1; }
  .unit .meta {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .log {
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    height: 88px;
    overflow: auto;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink);
  }
  .log p { margin: 0; }
  .log .sys, .log .dim { color: var(--ink-muted); }
  .log .dmg { color: var(--hp); }
  .log .heal { color: var(--mp); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    min-height: 36px;
  }
  .actions .hint-inline {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: auto;
  }
  .prompt {
    width: 100%;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(18, 12, 8, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 20;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow:
      inset 0 0 0 1px #c9b89a,
      inset 0 0 0 4px var(--paper),
      inset 0 0 0 5px #2a2420,
      0 12px 36px rgba(8, 6, 4, 0.4);
    border-radius: 0;
    padding: 22px 26px 18px;
    text-align: left;
    max-width: 420px;
    width: min(420px, 92vw);
    position: relative;
  }
  .modal.opening {
    text-align: left;
    max-width: 460px;
    padding: 28px 32px 22px;
  }
  .modal h2 {
    font-size: 1.05rem;
    letter-spacing: 0.28em;
    margin-bottom: 14px;
    color: var(--ink);
    font-weight: 700;
  }
  .modal p { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.75; }
  .modal .opening-lines p {
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .modal .reward { color: var(--gold); font-weight: 700; }
  .modal .btn { margin-top: 16px; display: block; margin-left: auto; margin-right: auto; }

  .toast {
    display: none;
    position: sticky;
    bottom: 0;
    margin-top: 10px;
    width: 100%;
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--ink);
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toast.show { display: flex; }
  .toast .toast-msg { flex: 1; line-height: 1.5; }
  .toast .btn { flex-shrink: 0; padding: 6px 12px; font-size: 12px; }

  @media (max-width: 640px) {
    .party-row { flex-direction: column; }
    .topbar { flex-wrap: wrap; }
  }
</style>
<link rel="stylesheet" href="assets.css">
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <img class="seal" src="assets/ui-title-seal.jpg" alt="試煉">
        <h1>江湖试炼</h1>
      </div>
      <div class="stats">
        银两 <b id="silver">0</b>　经验 <b id="exp">0</b>
        <span class="phase" id="phase-label">探索</span>
      </div>
    </div>
    <div id="view"></div>
    <div id="toast" class="toast" hidden>
      <span class="toast-msg" id="toast-msg"></span>
      <button type="button" class="btn btn-primary" id="toast-btn">回地图</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal" id="modal"></div>
  </div>

<script>
(function () {
  "use strict";

  // ——— 数据 ———
  const MAP_SIZE = 5;
  const PLAYER_START = { x: 2, y: 4 };
  const ENCOUNTER = { x: 2, y: 1 }; // 触发战斗的格子（只打一次）

  // 不可走：边角树丛
  const BLOCKED = new Set(["0,0", "4,0", "0,4", "4,4", "1,0", "3,0"]);

  const OPENING_LINES = [
    "城门之外，青石尚湿。",
    "陆沉舟按了按剑柄，剑是新的，心却比剑更急。",
    "苏晚晴把药包往袖里一塞：「先别逞能，伤药有限。」",
    "铁无声只嗯了一声，刀背朝外，人站在最险的那侧。",
    "官道向北，林影里有人声。",
    "沉舟道：「走。今日便见见江湖。」",
    "晚晴冷笑：「见江湖容易，活着回来难。」",
    "无声抬刀，示意前路。",
    "风过林梢，像有人磨刀。",
    "往前走，踩到异样处，便是一战。",
  ];

  function baseParty() {
    return [
      {
        id: "lu",
        name: "陆沉舟",
        role: "少侠",
        tagline: "刚出江湖的少侠，剑还新，心比剑更急，总想先挡在人前。",
        maxHp: 120, hp: 120,
        maxMp: 40, mp: 40,
        atk: 18, def: 8, spd: 12,
        level: 1, exp: 0,
        attackName: "拔剑",
        skill: { name: "破风斩", cost: 12, desc: "单体重击，无视对方3点防御" },
        tempDef: 0,
      },
      {
        id: "su",
        name: "苏晚晴",
        role: "医女",
        tagline: "走方医女，嘴上不饶人，袖里伤药从不离身。",
        maxHp: 90, hp: 90,
        maxMp: 60, mp: 60,
        atk: 10, def: 6, spd: 14,
        level: 1, exp: 0,
        attackName: "点穴",
        skill: { name: "止血", cost: 15, desc: "治疗一名友方45点气血" },
        tempDef: 0,
      },
      {
        id: "tie",
        name: "铁无声",
        role: "刀客",
        tagline: "过路刀客，话少得像哑了，人却总站在最险的那一侧。",
        maxHp: 160, hp: 160,
        maxMp: 30, mp: 30,
        atk: 22, def: 14, spd: 8,
        level: 1, exp: 0,
        attackName: "横刀",
        skill: { name: "开路", cost: 10, desc: "单体1.3倍攻击，本回合自身防御+4" },
        tempDef: 0,
      },
    ];
  }

  function makeMinions(count) {
    const names = ["杂兵甲", "杂兵乙", "杂兵丙"];
    const list = [];
    for (let i = 0; i < count; i++) {
      list.push({
        id: "minion" + i,
        name: names[i] || "杂兵",
        role: "杂兵",
        maxHp: 80, hp: 80,
        maxMp: 0, mp: 0,
        atk: 14, def: 5, spd: 10,
        tempDef: 0,
        isEnemy: true,
      });
    }
    return list;
  }

  function effectiveDef(u) {
    return (u.def || 0) + (u.tempDef || 0);
  }

  /** 普通攻击伤害：max(1, atk - def) */
  function normalDamage(attacker, target) {
    return Math.max(1, attacker.atk - effectiveDef(target));
  }

  // ——— 状态 ———
  const state = {
    mode: "map", // map | combat | result
    px: PLAYER_START.x,
    py: PLAYER_START.y,
    encounterDone: false,
    silver: 0,
    exp: 0, // 队伍累计获得经验（展示用）
    party: baseParty(),
    openingShown: false,
    // combat
    enemies: [],
    fightSize: 0,
    turnQueue: [],
    turnIndex: 0,
    combatPhase: null, // pickAlly | pickAction | pickTarget | enemyTurn | wait
    actingAlly: null,
    pendingAction: null, // 'attack' | 'skill'
    log: [],
  };

  const view = document.getElementById("view");
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");

  function $(id) { return document.getElementById(id); }

  function updateTopbar() {
    $("silver").textContent = state.silver;
    $("exp").textContent = state.exp;
    $("phase-label").textContent =
      state.mode === "map" ? "探索" :
      state.mode === "combat" ? "战斗" : "结算";
  }

  function key(x, y) { return x + "," + y; }

  function isWalkable(x, y) {
    if (x < 0 || y < 0 || x >= MAP_SIZE || y >= MAP_SIZE) return false;
    return !BLOCKED.has(key(x, y));
  }

  function isAdjacent(x, y) {
    const dx = Math.abs(x - state.px);
    const dy = Math.abs(y - state.py);
    return (dx + dy === 1) && isWalkable(x, y);
  }

  function grantExpToAlly(ally, amount) {
    ally.exp = (ally.exp || 0) + amount;
    state.exp += amount;
    const notes = [];
    while (ally.exp >= 100) {
      ally.exp -= 100;
      ally.level = (ally.level || 1) + 1;
      ally.maxHp += 12;
      ally.hp = Math.min(ally.maxHp, ally.hp + 12);
      ally.atk += 2;
      ally.def = (ally.def || 0) + 1;
      ally.maxMp += 5;
      ally.mp = Math.min(ally.maxMp, ally.mp + 5);
      notes.push(`${ally.name} 升至 ${ally.level} 级！`);
    }
    return notes;
  }

  function portraitSrc(u) {
    if (!u || u.isEnemy) return "assets/portrait-bandit.jpg";
    if (u.id === "lu") return "assets/portrait-lu.jpg";
    if (u.id === "su") return "assets/portrait-su.jpg";
    if (u.id === "tie") return "assets/portrait-tie.jpg";
    return "assets/portrait-bandit.jpg";
  }

  // ——— 地图 ———
  function renderMap() {
    updateTopbar();
    let html = '<div class="map-wrap">';
    html += '<div class="map" aria-label="5x5 map">';
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const classes = ["cell"];
        const isPlayer = x === state.px && y === state.py;
        const isEnc = x === ENCOUNTER.x && y === ENCOUNTER.y;
        if (!isWalkable(x, y)) {
          classes.push("obstacle");
        } else {
          classes.push("walk");
          if (isAdjacent(x, y)) classes.push("adjacent");
          if (isEnc) {
            classes.push("encounter");
            if (state.encounterDone) classes.push("done");
          }
        }
        if (isPlayer) classes.push("player");

        html += `<div class="${classes.join(" ")}" data-x="${x}" data-y="${y}"></div>`;
      }
    }
    html += "</div>";
    html += '<p class="hint">点击相邻格移动 · 赤色遇敌格一战定音</p>';
    if (state.encounterDone) {
      html += '<p class="hint" style="margin-top:8px">山贼已除。可继续闲逛，或刷新页面重开。</p>';
    }

    html += '<div class="party-strip"><h3>同行</h3><div class="party-row">';
    state.party.forEach((p) => {
      const hpPct = Math.max(0, (p.hp / p.maxHp) * 100);
      const mpPct = p.maxMp ? Math.max(0, (p.mp / p.maxMp) * 100) : 0;
      html += `<div class="party-card">`;
      html += `<img class="port" src="${portraitSrc(p)}" alt="">`;
      html += `<div class="party-info">`;
      html += `<div class="pn">${escapeHtml(p.name)} <span class="role">${escapeHtml(p.role || "")} · Lv.${p.level || 1}</span></div>`;
      html += `<div class="pt">${escapeHtml(p.tagline || "")}</div>`;
      html += `<div class="row">气血 <div class="bar"><i style="width:${hpPct}%"></i></div></div>`;
      html += `<div class="row">内力 <div class="bar mp"><i style="width:${mpPct}%"></i></div></div>`;
      html += `</div></div>`;
    });
    html += "</div></div>";

    html += "</div>";
    view.innerHTML = html;

    view.querySelectorAll(".cell.adjacent").forEach((el) => {
      el.addEventListener("click", () => {
        const x = +el.dataset.x;
        const y = +el.dataset.y;
        moveTo(x, y);
      });
    });
  }

  function moveTo(x, y) {
    if (!isAdjacent(x, y)) return;
    state.px = x;
    state.py = y;
    if (
      x === ENCOUNTER.x &&
      y === ENCOUNTER.y &&
      !state.encounterDone
    ) {
      startCombat();
      return;
    }
    renderMap();
  }

  // ——— 战斗 ———
  function startCombat() {
    // 开战：保留等级成长，恢复至当前上限
    state.party.forEach((p) => {
      p.hp = p.maxHp;
      p.mp = p.maxMp;
      p.tempDef = 0;
    });
    const n = Math.random() < 0.5 ? 2 : 3;
    state.fightSize = n;
    state.enemies = makeMinions(n);
    state.log = [];
    state.mode = "combat";
    state.combatPhase = "wait";
    pushLog("sys", "刀声起了。");
    buildTurnQueue();
    renderCombat();
    setTimeout(nextTurn, 400);
  }

  function alive(u) { return u && u.hp > 0; }

  function buildTurnQueue() {
    const all = [...state.party, ...state.enemies].filter(alive);
    all.sort((a, b) => b.spd - a.spd || a.name.localeCompare(b.name, "zh"));
    state.turnQueue = all.map((u) => u.id);
    state.turnIndex = 0;
  }

  function findUnit(id) {
    return (
      state.party.find((p) => p.id === id) ||
      state.enemies.find((e) => e.id === id)
    );
  }

  function currentActor() {
    if (!state.turnQueue.length) return null;
    const id = state.turnQueue[state.turnIndex % state.turnQueue.length];
    return findUnit(id);
  }

  function advanceTurnIndex() {
    const len = state.turnQueue.length;
    for (let i = 0; i < len; i++) {
      state.turnIndex = (state.turnIndex + 1) % len;
      const u = findUnit(state.turnQueue[state.turnIndex]);
      if (alive(u)) return;
    }
  }

  function checkEnd() {
    const partyAlive = state.party.some(alive);
    const enemyAlive = state.enemies.some(alive);
    if (!enemyAlive) {
      endCombat(true);
      return true;
    }
    if (!partyAlive) {
      endCombat(false);
      return true;
    }
    return false;
  }

  function nextTurn() {
    if (state.mode !== "combat") return;
    if (checkEnd()) return;

    let actor = currentActor();
    let guard = 0;
    while (actor && !alive(actor) && guard < 20) {
      advanceTurnIndex();
      actor = currentActor();
      guard++;
    }
    if (!actor || !alive(actor)) {
      buildTurnQueue();
      actor = currentActor();
    }
    if (!actor) return;

    // 新回合开始：清掉本单位的临时防御
    actor.tempDef = 0;

    if (actor.isEnemy) {
      state.combatPhase = "enemyTurn";
      state.actingAlly = null;
      renderCombat();
      setTimeout(() => enemyAct(actor), 600);
    } else {
      state.actingAlly = actor;
      state.combatPhase = "pickAction";
      state.pendingAction = null;
      pushLog("sys", `轮到 ${actor.name}（${actor.role}）`);
      renderCombat();
    }
  }

  function enemyAct(enemy) {
    if (state.mode !== "combat" || !alive(enemy)) {
      finishActorTurn();
      return;
    }
    const targets = state.party.filter(alive);
    if (!targets.length) {
      finishActorTurn();
      return;
    }
    targets.sort((a, b) => a.hp - b.hp);
    const t = targets[0];
    const dmg = normalDamage(enemy, t);
    t.hp = Math.max(0, t.hp - dmg);
    pushLog("dmg", `${enemy.name} 挥刀砍向 ${t.name}，造成 ${dmg} 伤害！`);
    if (t.hp <= 0) pushLog("sys", `${t.name} 力竭倒下……`);
    renderCombat();
    setTimeout(finishActorTurn, 500);
  }

  function finishActorTurn() {
    if (checkEnd()) return;
    advanceTurnIndex();
    const still = state.turnQueue.some((id) => alive(findUnit(id)));
    if (!still) {
      buildTurnQueue();
    }
    setTimeout(nextTurn, 350);
  }

  function doAttack(attacker, target) {
    const dmg = normalDamage(attacker, target);
    target.hp = Math.max(0, target.hp - dmg);
    const an = attacker.attackName || "普攻";
    pushLog("dmg", `${attacker.name}「${an}」攻向 ${target.name}，造成 ${dmg} 伤害！`);
    if (target.hp <= 0) pushLog("sys", `${target.name} 倒下了！`);
  }

  function doSkill(attacker, targetOrNull) {
    const sk = attacker.skill;
    if (attacker.mp < sk.cost) {
      pushLog("sys", `${attacker.name} 内力不足，无法施展「${sk.name}」！`);
      return false;
    }
    attacker.mp -= sk.cost;

    if (attacker.id === "lu") {
      // 破风斩：floor(atk*1.6)，无视目标 3 点防御
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const mitigated = Math.max(0, effectiveDef(t) - 3);
      const dmg = Math.max(1, Math.floor(attacker.atk * 1.6) - mitigated);
      t.hp = Math.max(0, t.hp - dmg);
      pushLog("dmg", `${attacker.name} 施展「破风斩」！${t.name} 受到 ${dmg} 重创！`);
      if (t.hp <= 0) pushLog("sys", `${t.name} 倒下了！`);
    } else if (attacker.id === "su") {
      // 止血：治疗友方 45
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const heal = 45;
      const before = t.hp;
      t.hp = Math.min(t.maxHp, t.hp + heal);
      const actual = t.hp - before;
      pushLog("heal", `${attacker.name} 施展「止血」，为 ${t.name} 回复 ${actual} 气血！`);
    } else if (attacker.id === "tie") {
      // 开路：单体 1.3×atk，自身本回合防御+4
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const dmg = Math.max(1, Math.floor(attacker.atk * 1.3) - effectiveDef(t));
      t.hp = Math.max(0, t.hp - dmg);
      attacker.tempDef = 4;
      pushLog("dmg", `${attacker.name} 施展「开路」！${t.name} 受到 ${dmg} 伤害，无声守势更坚（防+4）！`);
      if (t.hp <= 0) pushLog("sys", `${t.name} 倒下了！`);
    }
    return true;
  }

  function pushLog(cls, text) {
    state.log.push({ cls, text });
    if (state.log.length > 40) state.log.shift();
  }

  function renderCombat() {
    updateTopbar();
    const actor = state.actingAlly || (state.combatPhase === "enemyTurn" ? currentActor() : null);

    let html = '<div class="combat">';
    if (state.actingAlly && alive(state.actingAlly) && state.combatPhase === "pickAction") {
      html += `<div class="turn">${escapeHtml(state.actingAlly.name)} 的回合 · 选动作后点选一个目标</div>`;
    } else if (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") {
      html += `<div class="turn">点选一个敌人</div>`;
    } else if (state.combatPhase === "pickTargetHeal") {
      html += `<div class="turn">点选一名友方治疗</div>`;
    } else if (state.combatPhase === "enemyTurn" && actor) {
      html += `<div class="turn">${escapeHtml(actor.name)} 行动中……</div>`;
    } else {
      html += `<div class="turn">遭遇战</div>`;
    }

    html += '<div class="stage">';

    // 我方
    html += '<div class="side"><h2>我方</h2>';
    state.party.forEach((p) => {
      const cls = ["unit"];
      if (!alive(p)) cls.push("down");
      if (actor && actor.id === p.id) cls.push("active");
      if (state.combatPhase === "pickTargetHeal" && alive(p)) cls.push("selectable");
      html += unitCard(p, cls.join(" "), false);
    });
    html += "</div>";

    // 敌方
    html += '<div class="side"><h2>敌方</h2>';
    state.enemies.forEach((e) => {
      const cls = ["unit"];
      if (!alive(e)) cls.push("down");
      if (actor && actor.id === e.id) cls.push("active");
      if (
        (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") &&
        alive(e)
      ) {
        cls.push("selectable");
      }
      html += unitCard(e, cls.join(" "), true);
    });
    html += "</div></div>";

    // log
    html += '<div class="log" id="combat-log">';
    state.log.forEach((l) => {
      html += `<p class="${l.cls}">${escapeHtml(l.text)}</p>`;
    });
    html += "</div>";

    // actions
    html += '<div class="actions" id="combat-actions">';
    if (state.combatPhase === "pickAction" && state.actingAlly && alive(state.actingAlly)) {
      const a = state.actingAlly;
      const atkLabel = a.attackName || "普攻";
      html += `<button type="button" class="btn btn-primary" id="btn-atk">${escapeHtml(atkLabel)}</button>`;
      const canSkill = a.mp >= a.skill.cost;
      html += `<button type="button" class="btn" id="btn-skill" ${canSkill ? "" : "disabled"}>技能 · ${escapeHtml(a.skill.name)}（${a.skill.cost}）</button>`;
      html += `<span class="hint-inline">${escapeHtml(a.skill.desc)}</span>`;
    } else if (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") {
      html += `<span class="hint-inline" style="margin-left:0">点选一个敌人</span>`;
      html += `<button type="button" class="btn" id="btn-cancel">取消</button>`;
    } else if (state.combatPhase === "pickTargetHeal") {
      html += `<span class="hint-inline" style="margin-left:0">点选一名友方</span>`;
      html += `<button type="button" class="btn" id="btn-cancel">取消</button>`;
    } else if (state.combatPhase === "enemyTurn") {
      html += `<span class="hint-inline" style="margin-left:0">敌方行动中……</span>`;
    }
    html += "</div></div>";

    view.innerHTML = html;
    const logEl = $("combat-log");
    if (logEl) logEl.scrollTop = logEl.scrollHeight;

    bindCombatEvents();
  }

  function unitCard(u, cls, isEnemy) {
    const hpPct = Math.max(0, (u.hp / u.maxHp) * 100);
    const mpPct = u.maxMp ? Math.max(0, (u.mp / u.maxMp) * 100) : 0;
    const defShow = effectiveDef(u);
    let html = `<div class="${cls}" data-id="${u.id}">`;
    html += `<img class="port" src="${portraitSrc(u)}" alt="">`;
    html += `<div class="unit-body">`;
    html += `<div class="name">${escapeHtml(u.name)}<span class="role">${escapeHtml(u.role || "")}</span></div>`;
    html += `<div class="row">气血 <div class="bar"><i style="width:${hpPct}%"></i></div> ${u.hp}/${u.maxHp}</div>`;
    if (!isEnemy) {
      html += `<div class="row">内力 <div class="bar mp"><i style="width:${mpPct}%"></i></div> ${u.mp}/${u.maxMp}</div>`;
    }
    html += `<div class="meta">攻 ${u.atk} · 防 ${defShow} · 速 ${u.spd}</div>`;
    html += `</div></div>`;
    return html;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function bindCombatEvents() {
    const btnAtk = $("btn-atk");
    const btnSkill = $("btn-skill");
    const btnCancel = $("btn-cancel");

    if (btnAtk) {
      btnAtk.addEventListener("click", () => {
        state.pendingAction = "attack";
        state.combatPhase = "pickTarget";
        renderCombat();
      });
    }
    if (btnSkill) {
      btnSkill.addEventListener("click", () => {
        const a = state.actingAlly;
        if (!a) return;
        state.pendingAction = "skill";
        if (a.id === "su") {
          state.combatPhase = "pickTargetHeal";
        } else {
          // 陆沉舟破风斩、铁无声开路：均需选单体敌人
          state.combatPhase = "pickTargetSkill";
        }
        renderCombat();
      });
    }
    if (btnCancel) {
      btnCancel.addEventListener("click", () => {
        state.pendingAction = null;
        state.combatPhase = "pickAction";
        renderCombat();
      });
    }

    view.querySelectorAll(".unit.selectable").forEach((el) => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        const a = state.actingAlly;
        if (!a) return;

        if (state.combatPhase === "pickTarget") {
          const t = state.enemies.find((e) => e.id === id);
          if (!t || !alive(t)) return;
          doAttack(a, t);
          renderCombat();
          setTimeout(finishActorTurn, 450);
        } else if (state.combatPhase === "pickTargetSkill") {
          const t = state.enemies.find((e) => e.id === id);
          if (!t || !alive(t)) return;
          const ok = doSkill(a, t);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
        } else if (state.combatPhase === "pickTargetHeal") {
          const t = state.party.find((p) => p.id === id);
          if (!t || !alive(t)) return;
          const ok = doSkill(a, t);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
        }
      });
    });
  }

  function endCombat(won) {
    state.mode = "result";
    state.combatPhase = null;
    if (won) {
      state.encounterDone = true;
      const n = state.fightSize || state.enemies.length;
      const perExp = n >= 3 ? 30 : 20;
      const silverGain = n >= 3 ? 12 : 8;
      state.silver += silverGain;
      const levelNotes = [];
      state.party.forEach((p) => {
        if (alive(p)) {
          levelNotes.push(...grantExpToAlly(p, perExp));
        }
      });
      updateTopbar();
      let body = `<p>这一仗过了。经验、银两入袋。</p>
         <p class="reward">银两 +${silverGain}　每名胜者经验 +${perExp}</p>
         <p>当前银两 ${state.silver} · 队伍经验 ${state.exp}</p>`;
      if (levelNotes.length) {
        body += `<p>${levelNotes.map(escapeHtml).join("<br>")}</p>`;
      }
      state.mode = "map";
      renderMap();
      showToast(
        `这一仗过了。经验、银两入袋。　银两 +${silverGain}　经验 +${perExp}` +
          (levelNotes.length ? "　" + levelNotes.join("；") : ""),
        "继续"
      );
    } else {
      state.silver = Math.max(0, state.silver - 2);
      // 退回城口：复活并回满，保留等级与银两，遇敌可再战
      state.party.forEach((p) => {
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        p.tempDef = 0;
      });
      state.px = PLAYER_START.x;
      state.py = PLAYER_START.y;
      state.encounterDone = false;
      updateTopbar();
      state.mode = "map";
      renderMap();
      showToast(`撑不住。先退回城口。　银两 ${state.silver}`, "回城口");
    }
  }


  function showToast(msg, btnText) {
    const el = $("toast");
    $("toast-msg").textContent = msg;
    $("toast-btn").textContent = btnText || "继续";
    el.classList.add("show");
    el.hidden = false;
    const btn = $("toast-btn");
    const done = () => {
      hideToast();
    };
    btn.onclick = done;
  }

  function hideToast() {
    const el = $("toast");
    el.classList.remove("show");
    el.hidden = true;
  }

  function showModal(title, bodyHtml, btnText, onClick, extraClass) {
    modal.className = "modal" + (extraClass ? " " + extraClass : "");
    modal.innerHTML = `<h2>${escapeHtml(title)}</h2>${bodyHtml}<br><button type="button" class="btn btn-primary" id="modal-btn">${escapeHtml(btnText)}</button>`;
    overlay.classList.remove("hidden");
    $("modal-btn").addEventListener("click", onClick);
  }

  function hideModal() {
    overlay.classList.add("hidden");
    modal.className = "modal";
    modal.innerHTML = "";
  }

  function showOpening() {
    const linesHtml =
      '<div class="opening-lines">' +
      OPENING_LINES.map((line) => `<p>${escapeHtml(line)}</p>`).join("") +
      "</div>";
    showModal(
      "出城",
      linesHtml,
      "上路",
      () => {
        hideModal();
        state.openingShown = true;
        state.mode = "map";
        renderMap();
      },
      "opening"
    );
  }

  function resetGame() {
    state.mode = "map";
    state.px = PLAYER_START.x;
    state.py = PLAYER_START.y;
    state.encounterDone = false;
    state.silver = 0;
    state.exp = 0;
    state.party = baseParty();
    state.enemies = [];
    state.log = [];
    state.fightSize = 0;
    updateTopbar();
    if (!state.openingShown) {
      showOpening();
    } else {
      renderMap();
    }
  }

  // 启动
  resetGame();
})();
</script>
</body>
</html>
