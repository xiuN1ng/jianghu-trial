<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《江湖试炼》— 试玩原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ead8;
    --paper-dark: #e6d9c2;
    --ink: #2a2420;
    --ink-muted: #6b5e52;
    --border: #8a7a68;
    --gold: #b8860b;
    --hp: #c44536;
    --hp-bg: #e8d4ce;
    --mp: #3d6b8c;
    --mp-bg: #d4e0e8;
    --encounter: #c44536;
    --obstacle: #5a6b4a;
    --walk: #f7f1e6;
    --player: #2a2420;
    --btn: #e8dcc8;
    --btn-hover: #dccfb8;
    --btn-primary: #5c4033;
    --btn-primary-text: #f3ead8;
    --btn-disabled: #cfc4b4;
    --log-bg: #ebe2d2;
    --cinnabar: #c44536;
    --earth: #efe4d0;
    --earth-bright: #f6efe2;
    --moss: #c5cbb0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Serif SC", "Songti SC", "Source Han Serif SC", serif;
    background:
      linear-gradient(180deg, rgba(22, 16, 12, 0.58) 0%, rgba(12, 9, 7, 0.72) 100%),
      url("assets/bg-mountain-path.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  #app {
    position: relative;
    width: 100%;
    max-width: 720px;
    background: var(--paper);
    padding: 22px 26px 18px;
    border: 2px solid #2a2420;
    box-shadow:
      inset 0 0 0 1px #c9b89a,
      inset 0 0 0 5px var(--paper),
      inset 0 0 0 6px #2a2420,
      0 22px 56px rgba(8, 6, 4, 0.48);
    overflow: hidden;
  }
  #app::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.09;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(42, 36, 32, 0.22) 2px,
        rgba(42, 36, 32, 0.22) 3px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 3px,
        rgba(42, 36, 32, 0.12) 3px,
        rgba(42, 36, 32, 0.12) 4px
      );
  }
  #app > * { position: relative; z-index: 1; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    gap: 12px;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .seal {
    width: 44px;
    height: 44px;
    object-fit: cover;
    transform: rotate(-8deg);
    border: 1px solid rgba(139, 30, 30, 0.45);
    box-shadow: 0 1px 4px rgba(90, 18, 12, 0.25);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
    font-family: inherit;
  }
  .topbar .stats {
    font-size: 13px;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .topbar .stats b { color: var(--gold); }
  .topbar .phase {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: 10px;
  }

  #view { min-height: 360px; }

  .btn {
    background: var(--btn);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn-primary {
    background: var(--btn-primary);
    color: var(--btn-primary-text);
    border-color: var(--btn-primary);
  }
  .btn-primary:hover:not(:disabled) {
    background: #4a3328;
    border-color: #4a3328;
  }
  .btn:disabled {
    background: var(--btn-disabled);
    color: var(--ink-muted);
    cursor: not-allowed;
  }

  .bar {
    height: 7px;
    border-radius: 1px;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--hp-bg);
    flex: 1;
  }
  .bar.mp { background: var(--mp-bg); }
  .bar > i {
    display: block;
    height: 100%;
    background: var(--hp);
    transition: width 0.25s;
  }
  .bar.mp > i { background: var(--mp); }

  .cell {
    width: 56px;
    height: 56px;
    font-size: 0;
    color: transparent;
    border: 1px solid rgba(90, 74, 58, 0.45);
    background-size: 56px 56px;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    user-select: none;
    position: relative;
  }
  .cell.walk { background-image: url("assets/tiles/walk.svg"); }
  .cell.obstacle { background-image: url("assets/tiles/pine.svg"); }
  .cell.encounter { background-image: url("assets/tiles/encounter.svg"); }
  .cell.encounter.done { background-image: url("assets/tiles/walk.svg"); opacity: 0.85; }
  .cell.town { background-image: url("assets/tiles/town.svg"); }
  .cell.gossip { background-image: url("assets/tiles/gossip.svg"); }
  .cell.gate {
    background-image: url("assets/tiles/walk.svg");
    box-shadow: inset 0 0 0 2px rgba(184, 134, 11, 0.55);
  }
  .cell.player { background-image: url("assets/tiles/player.svg"); opacity: 1; }
  .cell.walk.adjacent,
  .cell.gate.adjacent,
  .cell.town.adjacent,
  .cell.encounter.adjacent {
    cursor: pointer;
    box-shadow: inset 0 0 0 2px #8a7a68;
  }
  .cell.walk.adjacent:hover,
  .cell.gate.adjacent:hover,
  .cell.town.adjacent:hover,
  .cell.encounter.adjacent:hover {
    box-shadow: inset 0 0 0 2px #b8860b;
  }

  .map-wrap { text-align: center; }
  .map {
    display: grid;
    grid-template-columns: repeat(5, 56px);
    gap: 0;
    margin: 0 auto 12px;
    width: fit-content;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 10px rgba(42, 36, 32, 0.12);
  }
  .hint {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .party-strip {
    text-align: left;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .party-strip h3 {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: 0.2em;
  }
  .party-row {
    display: flex;
    gap: 8px;
  }
  .party-card {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 8px;
    background: var(--paper-dark);
    border: 1px solid var(--border);
    padding: 6px;
  }
  .party-card .portrait {
    width: 48px;
    height: 64px;
    object-fit: cover;
    object-position: 50% 16%;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .party-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .party-card .pn {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
  }
  .party-card .pn .role {
    font-weight: 400;
    font-size: 11px;
    color: var(--ink-muted);
    margin-left: 2px;
  }
  .party-card .pt {
    color: var(--ink-muted);
    font-size: 10px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 2px 0 4px;
  }
  .party-card .row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .combat { display: flex; flex-direction: column; gap: 10px; }
  .turn {
    font-size: 13px;
    margin-bottom: 2px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.06em;
  }
  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .side h2 {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.18em;
  }
  .fx-float{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;pointer-events:none;animation:fx-pop 700ms ease-out forwards;text-shadow:0 1px 0 #f3ead8;z-index:2}
  .fx-float.dmg{color:#c44536}
  .fx-float.heal{color:#3d6b8c}
  @keyframes fx-pop{0%{opacity:1;top:8px}100%{opacity:0;top:-18px}}
  .unit.hit{animation:fx-hit 180ms ease-in}
  @keyframes fx-hit{0%{filter:brightness(1.4)}40%{transform:translateX(3px)}100%{filter:none;transform:none}}
  .unit {
    position: relative;
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 6px;
    margin-bottom: 6px;
    cursor: default;
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .unit .portrait {
    width: 48px;
    height: 64px;
    object-fit: cover;
    object-position: 50% 16%;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .unit-body { flex: 1; min-width: 0; }
  .unit.active { outline: 2px solid var(--cinnabar); outline-offset: 0; }
  .unit.selectable { cursor: pointer; outline: 1px dashed var(--border); }
  .unit.selectable:hover { background: #ddd2bc; }
  .unit.down { opacity: 0.42; filter: grayscale(1); }
  .unit .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .unit .name .role {
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-muted);
    margin-left: 6px;
  }
  .unit .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 11px;
    color: var(--ink-muted);
  }
  .unit .row .bar { flex: 1; }
  .unit .meta {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .log {
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    height: 88px;
    overflow: auto;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink);
  }
  .log p { margin: 0; }
  .log .sys, .log .dim { color: var(--ink-muted); }
  .log .dmg { color: var(--hp); }
  .log .heal { color: var(--mp); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    min-height: 36px;
  }
  .actions .hint-inline {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: auto;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(18, 12, 8, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 20;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow:
      inset 0 0 0 1px #c9b89a,
      inset 0 0 0 4px var(--paper),
      inset 0 0 0 5px #2a2420,
      0 12px 36px rgba(8, 6, 4, 0.4);
    border-radius: 0;
    padding: 22px 26px 18px;
    text-align: left;
    max-width: 420px;
    width: min(420px, 92vw);
    position: relative;
  }
  .modal.opening {
    text-align: left;
    max-width: 460px;
    padding: 28px 32px 22px;
  }
  .modal h2 {
    font-size: 1.05rem;
    letter-spacing: 0.28em;
    margin-bottom: 14px;
    color: var(--ink);
    font-weight: 700;
  }
  .modal p { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.75; }
  .modal .opening-lines p {
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .modal .reward { color: var(--gold); font-weight: 700; }
  .modal .btn { margin-top: 12px; }
  .modal .shop-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .modal .dialogue-line {
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.85;
    letter-spacing: 0.04em;
  }

  .toast {
    display: none;
    position: sticky;
    bottom: 0;
    margin-top: 10px;
    width: 100%;
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--ink);
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toast.show { display: flex; }
  .toast .toast-msg { flex: 1; line-height: 1.5; }
  .toast .btn { flex-shrink: 0; padding: 6px 12px; font-size: 12px; }

  @media (max-width: 640px) {
    .party-row { flex-direction: column; }
    .topbar { flex-wrap: wrap; }
  }
</style>
<link rel="stylesheet" href="assets.css">
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <img class="seal" src="assets/ui-title-seal.jpg" alt="試煉">
        <h1>江湖试炼</h1>
      </div>
      <div class="stats">
        银两 <b id="silver">0</b>　经验 <b id="exp">0</b>
        <span class="phase" id="phase-label">林道</span>
      </div>
    </div>
    <div id="view"></div>
    <div id="toast" class="toast" hidden>
      <span class="toast-msg" id="toast-msg"></span>
      <button type="button" class="btn btn-primary" id="toast-btn">回地图</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal" id="modal"></div>
  </div>

<script>
(function () {
  "use strict";

  const MAP_SIZE = 5;
  const MAP_NAMES = { forest: "林道", town: "城镇", mountain: "山路" };

  const MAPS = {
    forest: {
      id: "forest",
      entrance: { x: 2, y: 4 },
      blocked: new Set(["0,0", "4,0", "0,4", "4,4", "1,0", "3,0"]),
      encounter: { x: 2, y: 1 },
      hunter: { x: 0, y: 2 },
      gate: { x: 4, y: 2 },
      hint: "点击相邻格移动 · 西侧猎户 · 林中遇敌 · 除贼后东口通城",
    },
    town: {
      id: "town",
      entrance: { x: 0, y: 2 },
      blocked: new Set(["0,0", "4,0", "0,4", "4,4"]),
      shop: { x: 2, y: 2 },
      gossip: { x: 2, y: 1 },
      gateOut: { x: 4, y: 2 },
      gateBack: { x: 0, y: 2 },
      hint: "城镇歇脚 · 药铺买药 · 北侧茶摊听闲话 · 东口通山路",
    },
    mountain: {
      id: "mountain",
      entrance: { x: 2, y: 4 },
      blocked: new Set(["0,0", "1,0", "3,0", "4,0", "0,4", "4,4", "0,1", "4,1"]),
      encounter: { x: 2, y: 1 },
      gateBack: { x: 1, y: 4 },
      hint: "山路狭险 · 刀疤客拦路 · 西侧可回城 · 败则退回入口",
    },
  };

  const OPENING_LINES = [
    "城门之外，青石尚湿。",
    "陆沉舟按了按剑柄，剑是新的，心却比剑更急。",
    "苏晚晴把药包往袖里一塞：「先别逞能，伤药有限。」",
    "铁无声只嗯了一声，刀背朝外，人站在最险的那侧。",
    "官道向北，林影里有人声。",
    "沉舟道：「走。今日便见见江湖。」",
    "晚晴冷笑：「见江湖容易，活着回来难。」",
    "无声抬刀，示意前路。",
    "风过林梢，像有人磨刀。",
    "往前走，踩到异样处，便是一战。",
  ];

  function baseParty() {
    return [
      {
        id: "lu",
        name: "陆沉舟",
        role: "少侠",
        tagline: "刚出江湖的少侠，剑还新，心比剑更急，总想先挡在人前。",
        maxHp: 120, hp: 120,
        maxMp: 40, mp: 40,
        atk: 18, def: 8, spd: 12,
        level: 1, exp: 0,
        attackName: "拔剑",
        skill1: { name: "破风斩", cost: 12, desc: "单体重击，无视对方3点防御" },
        skill2: { name: "横剑", cost: 16, desc: "攻击全体敌人，各造成约八成攻击力伤害" },
        tempDef: 0,
      },
      {
        id: "su",
        name: "苏晚晴",
        role: "医女",
        tagline: "走方医女，嘴上不饶人，袖里伤药从不离身。",
        maxHp: 90, hp: 90,
        maxMp: 60, mp: 60,
        atk: 10, def: 6, spd: 14,
        level: 1, exp: 0,
        attackName: "点穴",
        skill1: { name: "止血", cost: 15, desc: "治疗一名友方45点气血" },
        skill2: { name: "金疮", cost: 20, desc: "全体友方回复22点气血" },
        tempDef: 0,
      },
      {
        id: "tie",
        name: "铁无声",
        role: "刀客",
        tagline: "过路刀客，话少得像哑了，人却总站在最险的那一侧。",
        maxHp: 160, hp: 160,
        maxMp: 30, mp: 30,
        atk: 22, def: 14, spd: 8,
        level: 1, exp: 0,
        attackName: "横刀",
        skill1: { name: "开路", cost: 10, desc: "单体1.3倍攻击，本回合自身防御+4" },
        skill2: { name: "挡刀", cost: 12, desc: "指定一名友方，本回合临时防御+6" },
        tempDef: 0,
      },
    ];
  }

  function makeForestEnemies() {
    const names = ["杂兵甲", "杂兵乙", "杂兵丙"];
    const count = Math.random() < 0.5 ? 2 : 3;
    const list = [];
    for (let i = 0; i < count; i++) {
      list.push({
        id: "minion" + i,
        name: names[i] || "杂兵",
        role: "杂兵",
        maxHp: 80, hp: 80,
        maxMp: 0, mp: 0,
        atk: 14, def: 5, spd: 10,
        tempDef: 0,
        isEnemy: true,
        attackName: "挥刀",
      });
    }
    return list;
  }

  function makeChief() {
    return {
      id: "chief",
      name: "刀疤客",
      role: "精英",
      maxHp: 220, hp: 220,
      maxMp: 0, mp: 0,
      atk: 20, def: 10, spd: 11,
      tempDef: 0,
      isEnemy: true,
      attackName: "索命刀",
      actionCount: 0,
    };
  }

  function effectiveDef(u) {
    return (u.def || 0) + (u.tempDef || 0);
  }

  function normalDamage(attacker, target) {
    return Math.max(1, attacker.atk - effectiveDef(target));
  }

  const state = {
    mode: "map",
    mapId: "forest",
    px: MAPS.forest.entrance.x,
    py: MAPS.forest.entrance.y,
    encounterDone: false,
    eliteDone: false,
    chapterClear: false,
    boughtBlade: false,
    hunterTalked: false,
    eliteIntroDone: false,
    townUnlocked: false,
    mountainUnlocked: false,
    silver: 0,
    exp: 0,
    party: baseParty(),
    openingShown: false,
    enemies: [],
    fightSize: 0,
    combatKind: null,
    turnQueue: [],
    turnIndex: 0,
    combatPhase: null,
    actingAlly: null,
    pendingAction: null,
    pendingSkillSlot: null,
    log: [],
    fx: [],
  };

  const view = document.getElementById("view");
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");

  function $(id) { return document.getElementById(id); }

  function currentMap() {
    return MAPS[state.mapId] || MAPS.forest;
  }

  function updateTopbar() {
    $("silver").textContent = state.silver;
    $("exp").textContent = state.exp;
    if (state.mode === "combat") {
      $("phase-label").textContent = "战斗 · " + (MAP_NAMES[state.mapId] || "");
    } else if (state.chapterClear) {
      $("phase-label").textContent = "试炼已过";
    } else {
      $("phase-label").textContent = MAP_NAMES[state.mapId] || "探索";
    }
  }

  function key(x, y) { return x + "," + y; }

  function isWalkable(x, y) {
    if (x < 0 || y < 0 || x >= MAP_SIZE || y >= MAP_SIZE) return false;
    const m = currentMap();
    if (m.blocked.has(key(x, y))) return false;
    return true;
  }

  function isAdjacent(x, y) {
    const dx = Math.abs(x - state.px);
    const dy = Math.abs(y - state.py);
    return (dx + dy === 1) && isWalkable(x, y);
  }

  function restorePartyFull() {
    state.party.forEach((p) => {
      p.hp = p.maxHp;
      p.mp = p.maxMp;
      p.tempDef = 0;
    });
  }

  function grantExpToAlly(ally, amount) {
    ally.exp = (ally.exp || 0) + amount;
    state.exp += amount;
    const notes = [];
    while (ally.exp >= 100) {
      ally.exp -= 100;
      ally.level = (ally.level || 1) + 1;
      ally.maxHp += 12;
      ally.hp = Math.min(ally.maxHp, ally.hp + 12);
      ally.atk += 2;
      ally.def = (ally.def || 0) + 1;
      ally.maxMp += 5;
      ally.mp = Math.min(ally.maxMp, ally.mp + 5);
      notes.push(ally.name + " 升至 " + ally.level + " 级！");
    }
    return notes;
  }

  function portraitSrc(u) {
    if (!u) return "assets/portraits/bandit.png";
    if (u.id === "lu") return "assets/portraits/lu-chenzhou.png";
    if (u.id === "su") return "assets/portraits/su-wanqing.png";
    if (u.id === "tie") return "assets/portraits/tie-wusheng.png";
    if (u.id === "chief") return "assets/portraits/bandit-chief.png";
    return "assets/portraits/bandit.png";
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function enterMap(mapId, pos) {
    state.mapId = mapId;
    const m = MAPS[mapId];
    if (pos && typeof pos.x === "number") {
      state.px = pos.x;
      state.py = pos.y;
    } else if (pos !== false) {
      state.px = m.entrance.x;
      state.py = m.entrance.y;
    }
    state.mode = "map";
    renderMap();
  }

  function renderMap() {
    updateTopbar();
    const m = currentMap();
    let html = '<div class="map-wrap">';
    html += '<div class="map" aria-label="5x5 map">';
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const classes = ["cell"];
        const isPlayer = x === state.px && y === state.py;
        const walk = isWalkable(x, y);
        if (!walk && m.blocked.has(key(x, y))) {
          classes.push("obstacle");
        } else if (!walk) {
          classes.push("obstacle");
        } else {
          classes.push("walk");
          if (isAdjacent(x, y)) classes.push("adjacent");

          if (m.encounter && x === m.encounter.x && y === m.encounter.y) {
            if (state.mapId === "forest") {
              classes.push("encounter");
              if (state.encounterDone) classes.push("done");
            } else if (state.mapId === "mountain") {
              classes.push("encounter");
              if (state.eliteDone) classes.push("done");
            }
          }
          if (m.shop && x === m.shop.x && y === m.shop.y) {
            classes.push("town");
          }
          if (m.gossip && x === m.gossip.x && y === m.gossip.y) {
            classes.push("gossip");
          }
          if (state.mapId === "forest" && m.gate && x === m.gate.x && y === m.gate.y && state.encounterDone) {
            classes.push("gate");
          }
          if (state.mapId === "town" && m.gateOut && x === m.gateOut.x && y === m.gateOut.y) {
            classes.push("gate");
          }
          if (m.gateBack && x === m.gateBack.x && y === m.gateBack.y) {
            classes.push("gate");
          }
        }
        if (isPlayer) classes.push("player");
        html += '<div class="' + classes.join(" ") + '" data-x="' + x + '" data-y="' + y + '"></div>';
      }
    }
    html += "</div>";
    html += '<p class="hint">' + escapeHtml(m.hint || "点击相邻格移动") + "</p>";
    if (state.mapId === "forest" && state.encounterDone) {
      html += '<p class="hint" style="margin-top:8px">林道已清。东侧城口已开，可前往城镇。</p>';
    }
    if (state.chapterClear) {
      html += '<p class="hint" style="margin-top:8px">本回试炼已过。刷新页面可重开。</p>';
    }

    html += '<div class="party-strip"><h3>同行</h3><div class="party-row">';
    state.party.forEach((p) => {
      const hpPct = Math.max(0, (p.hp / p.maxHp) * 100);
      const mpPct = p.maxMp ? Math.max(0, (p.mp / p.maxMp) * 100) : 0;
      html += '<div class="party-card">';
      html += '<img class="portrait" src="' + portraitSrc(p) + '" alt="">';
      html += '<div class="party-info">';
      html += '<div class="pn">' + escapeHtml(p.name) + ' <span class="role">' + escapeHtml(p.role || "") + " · Lv." + (p.level || 1) + "</span></div>";
      html += '<div class="pt">' + escapeHtml(p.tagline || "") + "</div>";
      html += '<div class="row">气血 <div class="bar"><i style="width:' + hpPct + '%"></i></div></div>';
      html += '<div class="row">内力 <div class="bar mp"><i style="width:' + mpPct + '%"></i></div></div>';
      html += "</div></div>";
    });
    html += "</div></div></div>";
    view.innerHTML = html;

    view.querySelectorAll(".cell.adjacent").forEach((el) => {
      el.addEventListener("click", () => {
        moveTo(+el.dataset.x, +el.dataset.y);
      });
    });
  }

  function moveTo(x, y) {
    if (!isAdjacent(x, y) || state.mode !== "map") return;
    state.px = x;
    state.py = y;
    const m = currentMap();

    if (state.mapId === "forest") {
      if (m.hunter && x === m.hunter.x && y === m.hunter.y) {
        renderMap();
        showHunterDialogue();
        return;
      }
      if (m.encounter && x === m.encounter.x && y === m.encounter.y && !state.encounterDone) {
        startCombat("forest");
        return;
      }
      if (m.gate && x === m.gate.x && y === m.gate.y) {
        if (state.encounterDone) {
          state.townUnlocked = true;
          enterMap("town", MAPS.town.entrance);
          showToast("出了林道，官道尽头是城镇。", "进城");
          return;
        }
        renderMap();
        showToast("林中尚有贼影，官道未开。", "知道了");
        return;
      }
    }

    if (state.mapId === "town") {
      if (m.shop && x === m.shop.x && y === m.shop.y) {
        renderMap();
        showShopDialogue();
        return;
      }
      if (m.gossip && x === m.gossip.x && y === m.gossip.y) {
        renderMap();
        showToast("茶摊闲话：北山刀疤客拦路，过路费少了就动手。", "知道了");
        return;
      }
      if (m.gateOut && x === m.gateOut.x && y === m.gateOut.y) {
        state.mountainUnlocked = true;
        enterMap("mountain", MAPS.mountain.entrance);
        showToast("出东口，山路渐陡。", "上路");
        return;
      }
      if (m.gateBack && x === m.gateBack.x && y === m.gateBack.y) {
        enterMap("forest", MAPS.forest.gate);
        showToast("折回林道。", "继续");
        return;
      }
    }

    if (state.mapId === "mountain") {
      if (m.encounter && x === m.encounter.x && y === m.encounter.y && !state.eliteDone && !state.chapterClear) {
        renderMap();
        maybeEliteIntroThenFight();
        return;
      }
      if (m.gateBack && x === m.gateBack.x && y === m.gateBack.y) {
        enterMap("town", MAPS.town.gateOut);
        showToast("折回城镇。", "继续");
        return;
      }
    }

    renderMap();
  }

  function showHunterDialogue() {
    state.hunterTalked = true;
    const lines =
      '<p class="dialogue-line">猎户：「林子里有刀疤脚印，别往深处走。」</p>' +
      '<p class="dialogue-line">陆：「多谢。前面可通官道？」</p>' +
      '<p class="dialogue-line">猎户：「通。通，却不一定活着到。」</p>';
    showModal("林道·猎户", lines, "告辞", () => {
      hideModal();
      renderMap();
    });
  }

  function showShopDialogue() {
    const lines =
      '<p class="dialogue-line">掌柜：「伤药八两一包。刀钝了？隔壁铁铺。」</p>' +
      '<p class="dialogue-line">苏：「药要新的。过期的我认得。」</p>' +
      '<p class="dialogue-line">掌柜：「……姑娘好眼力。」</p>' +
      '<div class="shop-actions">' +
      '<button type="button" class="btn btn-primary" id="buy-heal">伤药 8两</button>' +
      '<button type="button" class="btn" id="buy-blade"' + (state.boughtBlade ? " disabled" : "") + ">利刃 12两</button>" +
      '<button type="button" class="btn" id="shop-leave">离开</button>' +
      "</div>";
    modal.className = "modal";
    modal.innerHTML = "<h2>城镇·药铺</h2>" + lines;
    overlay.classList.remove("hidden");

    $("buy-heal").addEventListener("click", () => {
      if (state.silver < 8) {
        showToast("银两不够。伤药要八两。", "知道了");
        return;
      }
      state.silver -= 8;
      state.party.forEach((p) => {
        if (p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + 50);
      });
      updateTopbar();
      hideModal();
      renderMap();
      showToast("伤药入喉，众人气血各回五十。", "继续");
    });
    $("buy-blade").addEventListener("click", () => {
      if (state.boughtBlade) return;
      if (state.silver < 12) {
        showToast("银两不够。利刃要十二两。", "知道了");
        return;
      }
      state.silver -= 12;
      state.boughtBlade = true;
      state.party.forEach((p) => { p.atk += 2; });
      updateTopbar();
      hideModal();
      renderMap();
      showToast("利刃过手，本回全员攻击+2。", "继续");
    });
    $("shop-leave").addEventListener("click", () => {
      hideModal();
      renderMap();
    });
  }

  function maybeEliteIntroThenFight() {
    if (state.eliteIntroDone) {
      startCombat("mountain");
      return;
    }
    state.eliteIntroDone = true;
    const lines =
      '<p class="dialogue-line">铁：「这人站得稳。不是杂兵。」</p>' +
      '<p class="dialogue-line">陆：「报上名来。」</p>' +
      '<p class="dialogue-line">精英：「过路费，或者命。」</p>';
    showModal("山路·拦路", lines, "拔刀", () => {
      hideModal();
      startCombat("mountain");
    });
  }

  function startCombat(kind) {
    state.party.forEach((p) => { p.tempDef = 0; });
    state.combatKind = kind || "forest";
    if (state.combatKind === "mountain") {
      state.enemies = [makeChief()];
    } else {
      state.enemies = makeForestEnemies();
    }
    state.fightSize = state.enemies.length;
    state.log = [];
    state.mode = "combat";
    state.combatPhase = "wait";
    pushLog("sys", state.combatKind === "mountain" ? "刀疤客拦路。" : "刀声起了。");
    buildTurnQueue();
    renderCombat();
    setTimeout(nextTurn, 400);
  }

  function alive(u) { return u && u.hp > 0; }

  function buildTurnQueue() {
    const all = state.party.concat(state.enemies).filter(alive);
    all.sort(function (a, b) {
      return b.spd - a.spd || a.name.localeCompare(b.name, "zh");
    });
    state.turnQueue = all.map(function (u) { return u.id; });
    state.turnIndex = 0;
  }

  function findUnit(id) {
    return (
      state.party.find(function (p) { return p.id === id; }) ||
      state.enemies.find(function (e) { return e.id === id; })
    );
  }

  function currentActor() {
    if (!state.turnQueue.length) return null;
    const id = state.turnQueue[state.turnIndex % state.turnQueue.length];
    return findUnit(id);
  }

  function advanceTurnIndex() {
    const len = state.turnQueue.length;
    for (let i = 0; i < len; i++) {
      state.turnIndex = (state.turnIndex + 1) % len;
      const u = findUnit(state.turnQueue[state.turnIndex]);
      if (alive(u)) return;
    }
  }

  function checkEnd() {
    const partyAlive = state.party.some(alive);
    const enemyAlive = state.enemies.some(alive);
    if (!enemyAlive) {
      endCombat(true);
      return true;
    }
    if (!partyAlive) {
      endCombat(false);
      return true;
    }
    return false;
  }

  function nextTurn() {
    if (state.mode !== "combat") return;
    if (checkEnd()) return;

    let actor = currentActor();
    let guard = 0;
    while (actor && !alive(actor) && guard < 20) {
      advanceTurnIndex();
      actor = currentActor();
      guard++;
    }
    if (!actor || !alive(actor)) {
      buildTurnQueue();
      actor = currentActor();
    }
    if (!actor) return;

    if (actor.isEnemy) {
      state.combatPhase = "enemyTurn";
      state.actingAlly = null;
      renderCombat();
      setTimeout(function () { enemyAct(actor); }, 600);
    } else {
      state.actingAlly = actor;
      state.combatPhase = "pickAction";
      state.pendingAction = null;
      state.pendingSkillSlot = null;
      pushLog("sys", "轮到 " + actor.name + "（" + actor.role + "）");
      renderCombat();
    }
  }

  function enemyAct(enemy) {
    if (state.mode !== "combat" || !alive(enemy)) {
      finishActorTurn();
      return;
    }
    const targets = state.party.filter(alive);
    if (!targets.length) {
      finishActorTurn();
      return;
    }
    targets.sort(function (a, b) { return a.hp - b.hp; });
    const t = targets[0];

    if (enemy.id === "chief") {
      enemy.actionCount = (enemy.actionCount || 0) + 1;
      if (enemy.actionCount % 2 === 0) {
        const mitigated = Math.max(0, effectiveDef(t) - 2);
        const dmg = Math.max(1, Math.floor(enemy.atk * 1.4) - mitigated);
        t.hp = Math.max(0, t.hp - dmg);
        noteFx(t.id, dmg, "dmg");
        pushLog("dmg", enemy.name + "「拦路斩」劈向 " + t.name + "，造成 " + dmg + " 伤害！");
      } else {
        const dmg = normalDamage(enemy, t);
        t.hp = Math.max(0, t.hp - dmg);
        noteFx(t.id, dmg, "dmg");
        pushLog("dmg", enemy.name + "「索命刀」砍向 " + t.name + "，造成 " + dmg + " 伤害！");
      }
    } else {
      const dmg = normalDamage(enemy, t);
      t.hp = Math.max(0, t.hp - dmg);
      noteFx(t.id, dmg, "dmg");
      pushLog("dmg", enemy.name + " 挥刀砍向 " + t.name + "，造成 " + dmg + " 伤害！");
    }
    if (t.hp <= 0) pushLog("sys", t.name + " 力竭倒下……");
    renderCombat();
    setTimeout(finishActorTurn, 500);
  }

  function clearExpiredTempDef() {
    function tick(u) {
      if (!u) return;
      if ((u.tempDefPersist || 0) > 0) {
        u.tempDefPersist -= 1; // persist>0 这轮先留着
      } else {
        u.tempDef = 0;
      }
    }
    state.party.forEach(tick);
    state.enemies.forEach(tick);
  }

  function casterIsLastAlive() {
    const caster = state.actingAlly;
    if (!caster) return false;
    const q = state.turnQueue;
    const idx = q.indexOf(caster.id);
    if (idx < 0) return false;
    // 只看队列后半段，不绕回队头
    for (let i = idx + 1; i < q.length; i++) {
      if (alive(findUnit(q[i]))) return false;
    }
    return true;
  }

  function applyTempDef(target, amount) {
    if (!target) return;
    target.tempDef = (target.tempDef || 0) + amount;
    target.tempDefPersist = casterIsLastAlive() ? 1 : 0;
  }

  function finishActorTurn() {
    if (checkEnd()) return;
    const prevId = state.turnQueue[state.turnIndex];
    advanceTurnIndex();
    const still = state.turnQueue.some(function (id) { return alive(findUnit(id)); });
    if (!still) {
      buildTurnQueue();
    } else {
      const firstAlive = state.turnQueue.find(function (id) { return alive(findUnit(id)); });
      if (state.turnQueue[state.turnIndex] === firstAlive && prevId !== firstAlive) {
        clearExpiredTempDef();
      }
    }
    setTimeout(nextTurn, 350);
  }

  function noteFx(id, n, kind) {
    if (!state.fx) state.fx = [];
    state.fx.push({ id: id, n: n, kind: kind });
  }

  function doAttack(attacker, target) {
    const dmg = normalDamage(attacker, target);
    target.hp = Math.max(0, target.hp - dmg);
    noteFx(target.id, dmg, "dmg");
    const an = attacker.attackName || "普攻";
    pushLog("dmg", attacker.name + "「" + an + "」攻向 " + target.name + "，造成 " + dmg + " 伤害！");
    if (target.hp <= 0) pushLog("sys", target.name + " 倒下了！");
  }

  function getSkill(attacker, slot) {
    return slot === 2 ? attacker.skill2 : attacker.skill1;
  }

  function doSkill(attacker, slot, targetOrNull) {
    const sk = getSkill(attacker, slot);
    if (!sk) return false;
    if (attacker.mp < sk.cost) {
      pushLog("sys", attacker.name + " 内力不足，无法施展「" + sk.name + "」！");
      return false;
    }
    attacker.mp -= sk.cost;

    if (attacker.id === "lu" && slot === 1) {
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const mitigated = Math.max(0, effectiveDef(t) - 3);
      const dmg = Math.max(1, Math.floor(attacker.atk * 1.6) - mitigated);
      t.hp = Math.max(0, t.hp - dmg);
      noteFx(t.id, dmg, "dmg");
      pushLog("dmg", attacker.name + " 施展「破风斩」！" + t.name + " 受到 " + dmg + " 重创！");
      if (t.hp <= 0) pushLog("sys", t.name + " 倒下了！");
    } else if (attacker.id === "lu" && slot === 2) {
      const living = state.enemies.filter(alive);
      living.forEach(function (t) {
        const dmg = Math.max(1, Math.floor(attacker.atk * 0.8));
        t.hp = Math.max(0, t.hp - dmg);
        noteFx(t.id, dmg, "dmg");
        pushLog("dmg", attacker.name + "「横剑」扫过 " + t.name + "，造成 " + dmg + " 伤害！");
        if (t.hp <= 0) pushLog("sys", t.name + " 倒下了！");
      });
    } else if (attacker.id === "su" && slot === 1) {
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const heal = 45;
      const before = t.hp;
      t.hp = Math.min(t.maxHp, t.hp + heal);
      noteFx(t.id, t.hp - before, "heal");
      pushLog("heal", attacker.name + " 施展「止血」，为 " + t.name + " 回复 " + (t.hp - before) + " 气血！");
    } else if (attacker.id === "su" && slot === 2) {
      state.party.filter(alive).forEach(function (t) {
        const before = t.hp;
        t.hp = Math.min(t.maxHp, t.hp + 22);
        noteFx(t.id, t.hp - before, "heal");
        pushLog("heal", attacker.name + "「金疮」护住 " + t.name + "，回复 " + (t.hp - before) + " 气血！");
      });
    } else if (attacker.id === "tie" && slot === 1) {
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const dmg = Math.max(1, Math.floor(attacker.atk * 1.3) - effectiveDef(t));
      t.hp = Math.max(0, t.hp - dmg);
      noteFx(t.id, dmg, "dmg");
      applyTempDef(attacker, 4);
      pushLog("dmg", attacker.name + " 施展「开路」！" + t.name + " 受到 " + dmg + " 伤害，无声守势更坚（防+4）！");
      if (t.hp <= 0) pushLog("sys", t.name + " 倒下了！");
    } else if (attacker.id === "tie" && slot === 2) {
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      applyTempDef(t, 6);
      pushLog("heal", attacker.name + " 施展「挡刀」，" + t.name + " 本回合防御+6！");
    }
    return true;
  }

  function pushLog(cls, text) {
    state.log.push({ cls: cls, text: text });
    if (state.log.length > 40) state.log.shift();
  }

  function renderCombat() {
    updateTopbar();
    const actor = state.actingAlly || (state.combatPhase === "enemyTurn" ? currentActor() : null);

    let html = '<div class="combat">';
    if (state.actingAlly && alive(state.actingAlly) && state.combatPhase === "pickAction") {
      html += '<div class="turn">' + escapeHtml(state.actingAlly.name) + " 的回合 · 选动作</div>";
    } else if (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") {
      html += '<div class="turn">点选一个敌人</div>';
    } else if (state.combatPhase === "pickTargetHeal" || state.combatPhase === "pickTargetAlly") {
      html += '<div class="turn">点选一名友方</div>';
    } else if (state.combatPhase === "enemyTurn" && actor) {
      html += '<div class="turn">' + escapeHtml(actor.name) + " 行动中……</div>";
    } else {
      html += '<div class="turn">' + (state.combatKind === "mountain" ? "精英战" : "遭遇战") + "</div>";
    }

    html += '<div class="stage">';
    html += '<div class="side"><h2>我方</h2>';
    state.party.forEach(function (p) {
      const cls = ["unit"];
      if (!alive(p)) cls.push("down");
      if (actor && actor.id === p.id) cls.push("active");
      if ((state.combatPhase === "pickTargetHeal" || state.combatPhase === "pickTargetAlly") && alive(p)) {
        cls.push("selectable");
      }
      html += unitCard(p, cls.join(" "), false);
    });
    html += "</div>";

    html += '<div class="side"><h2>敌方</h2>';
    state.enemies.forEach(function (e) {
      const cls = ["unit"];
      if (!alive(e)) cls.push("down");
      if (actor && actor.id === e.id) cls.push("active");
      if ((state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") && alive(e)) {
        cls.push("selectable");
      }
      html += unitCard(e, cls.join(" "), true);
    });
    html += "</div></div>";

    html += '<div class="log" id="combat-log">';
    state.log.forEach(function (l) {
      html += '<p class="' + l.cls + '">' + escapeHtml(l.text) + "</p>";
    });
    html += "</div>";

    html += '<div class="actions" id="combat-actions">';
    if (state.combatPhase === "pickAction" && state.actingAlly && alive(state.actingAlly)) {
      const a = state.actingAlly;
      html += '<button type="button" class="btn btn-primary" id="btn-atk">普攻</button>';
      const can1 = a.mp >= a.skill1.cost;
      const can2 = a.mp >= a.skill2.cost;
      html += '<button type="button" class="btn" id="btn-skill1" ' + (can1 ? "" : "disabled") + ">技能1 · " + escapeHtml(a.skill1.name) + "（" + a.skill1.cost + "）</button>";
      html += '<button type="button" class="btn" id="btn-skill2" ' + (can2 ? "" : "disabled") + ">技能2 · " + escapeHtml(a.skill2.name) + "（" + a.skill2.cost + "）</button>";
      html += '<span class="hint-inline">' + escapeHtml(a.skill1.desc) + " ／ " + escapeHtml(a.skill2.desc) + "</span>";
    } else if (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") {
      html += '<span class="hint-inline" style="margin-left:0">点选一个敌人</span>';
      html += '<button type="button" class="btn" id="btn-cancel">取消</button>';
    } else if (state.combatPhase === "pickTargetHeal" || state.combatPhase === "pickTargetAlly") {
      html += '<span class="hint-inline" style="margin-left:0">点选一名友方</span>';
      html += '<button type="button" class="btn" id="btn-cancel">取消</button>';
    } else if (state.combatPhase === "enemyTurn") {
      html += '<span class="hint-inline" style="margin-left:0">敌方行动中……</span>';
    }
    html += "</div></div>";

    view.innerHTML = html;
    const logEl = $("combat-log");
    if (logEl) logEl.scrollTop = logEl.scrollHeight;
    bindCombatEvents();
    if (state.fx && state.fx.length) {
      setTimeout(function () { state.fx = []; }, 720);
    }
  }

  function unitCard(u, cls, isEnemy) {
    const hpPct = Math.max(0, (u.hp / u.maxHp) * 100);
    const mpPct = u.maxMp ? Math.max(0, (u.mp / u.maxMp) * 100) : 0;
    const defShow = effectiveDef(u);
    const hits = (state.fx || []).filter(function (f) { return f.id === u.id; });
    if (hits.some(function (f) { return f.kind === "dmg"; })) cls += " hit";
    let html = '<div class="' + cls + '" data-id="' + u.id + '">';
    hits.forEach(function (f) {
      const sign = f.kind === "heal" ? "+" : "-";
      html += '<span class="fx-float ' + f.kind + '">' + sign + f.n + "</span>";
    });
    html += '<img class="portrait" src="' + portraitSrc(u) + '" alt="">';
    html += '<div class="unit-body">';
    html += '<div class="name">' + escapeHtml(u.name) + '<span class="role">' + escapeHtml(u.role || "") + "</span></div>";
    html += '<div class="row">气血 <div class="bar"><i style="width:' + hpPct + '%"></i></div> ' + u.hp + "/" + u.maxHp + "</div>";
    if (!isEnemy) {
      html += '<div class="row">内力 <div class="bar mp"><i style="width:' + mpPct + '%"></i></div> ' + u.mp + "/" + u.maxMp + "</div>";
    }
    html += '<div class="meta">攻 ' + u.atk + " · 防 " + defShow + " · 速 " + u.spd + "</div>";
    html += "</div></div>";
    return html;
  }

  function bindCombatEvents() {
    const btnAtk = $("btn-atk");
    const btnSkill1 = $("btn-skill1");
    const btnSkill2 = $("btn-skill2");
    const btnCancel = $("btn-cancel");

    if (btnAtk) {
      btnAtk.addEventListener("click", function () {
        state.pendingAction = "attack";
        state.pendingSkillSlot = null;
        state.combatPhase = "pickTarget";
        renderCombat();
      });
    }

    function startSkill(slot) {
      const a = state.actingAlly;
      if (!a) return;
      state.pendingAction = "skill";
      state.pendingSkillSlot = slot;
      if (a.id === "lu" && slot === 2) {
        const ok = doSkill(a, 2, null);
        renderCombat();
        if (ok) setTimeout(finishActorTurn, 450);
        else {
          state.combatPhase = "pickAction";
          renderCombat();
        }
        return;
      }
      if (a.id === "su" && slot === 2) {
        const ok = doSkill(a, 2, null);
        renderCombat();
        if (ok) setTimeout(finishActorTurn, 450);
        else {
          state.combatPhase = "pickAction";
          renderCombat();
        }
        return;
      }
      if (a.id === "su" && slot === 1) {
        state.combatPhase = "pickTargetHeal";
      } else if (a.id === "tie" && slot === 2) {
        state.combatPhase = "pickTargetAlly";
      } else {
        state.combatPhase = "pickTargetSkill";
      }
      renderCombat();
    }

    if (btnSkill1) btnSkill1.addEventListener("click", function () { startSkill(1); });
    if (btnSkill2) btnSkill2.addEventListener("click", function () { startSkill(2); });

    if (btnCancel) {
      btnCancel.addEventListener("click", function () {
        state.pendingAction = null;
        state.pendingSkillSlot = null;
        state.combatPhase = "pickAction";
        renderCombat();
      });
    }

    view.querySelectorAll(".unit.selectable").forEach(function (el) {
      el.addEventListener("click", function () {
        const id = el.dataset.id;
        const a = state.actingAlly;
        if (!a) return;

        if (state.combatPhase === "pickTarget") {
          const t = state.enemies.find(function (e) { return e.id === id; });
          if (!t || !alive(t)) return;
          doAttack(a, t);
          renderCombat();
          setTimeout(finishActorTurn, 450);
        } else if (state.combatPhase === "pickTargetSkill") {
          const t = state.enemies.find(function (e) { return e.id === id; });
          if (!t || !alive(t)) return;
          const ok = doSkill(a, state.pendingSkillSlot || 1, t);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
        } else if (state.combatPhase === "pickTargetHeal" || state.combatPhase === "pickTargetAlly") {
          const t = state.party.find(function (p) { return p.id === id; });
          if (!t || !alive(t)) return;
          const ok = doSkill(a, state.pendingSkillSlot || 1, t);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
        }
      });
    });
  }

  function endCombat(won) {
    state.mode = "result";
    state.combatPhase = null;
    const kind = state.combatKind;

    if (won) {
      if (kind === "mountain") {
        state.eliteDone = true;
        state.chapterClear = true;
        state.silver += 20;
        const levelNotes = [];
        state.party.forEach(function (p) {
          if (alive(p)) levelNotes.push.apply(levelNotes, grantExpToAlly(p, 50));
        });
        updateTopbar();
        state.mode = "map";
        renderMap();
        let msg = "刀疤客跪地：「……路，你们过。」　银两 +20　经验 +50";
        if (levelNotes.length) msg += "　" + levelNotes.join("；");
        msg += "　本回试炼已过。";
        showToast(msg, "收刀");
        return;
      }

      // forest win — keep wounds, unlock town gate
      state.encounterDone = true;
      state.townUnlocked = true;
      const n = state.fightSize || state.enemies.length;
      const perExp = n >= 3 ? 30 : 20;
      const silverGain = n >= 3 ? 12 : 8;
      state.silver += silverGain;
      const levelNotes = [];
      state.party.forEach(function (p) {
        if (alive(p)) levelNotes.push.apply(levelNotes, grantExpToAlly(p, perExp));
      });
      updateTopbar();
      state.mode = "map";
      renderMap();
      let msg = "这一仗过了。伤口还在，城口已开。　银两 +" + silverGain + "　经验 +" + perExp;
      if (levelNotes.length) msg += "　" + levelNotes.join("；");
      showToast(msg, "继续");
    } else {
      state.silver = Math.max(0, state.silver - 2);
      restorePartyFull();
      const ent = currentMap().entrance;
      state.px = ent.x;
      state.py = ent.y;
      updateTopbar();
      state.mode = "map";
      renderMap();
      const backMsg =
        state.mapId === "mountain"
          ? "撑不住。先退回山路入口。　银两 " + state.silver
          : state.mapId === "town"
            ? "撑不住。先退回城口。　银两 " + state.silver
            : "撑不住。先退回林道入口。　银两 " + state.silver;
      showToast(backMsg, "回入口");
    }
  }

  function showToast(msg, btnText) {
    const el = $("toast");
    $("toast-msg").textContent = msg;
    $("toast-btn").textContent = btnText || "继续";
    el.classList.add("show");
    el.hidden = false;
    $("toast-btn").onclick = function () { hideToast(); };
  }

  function hideToast() {
    const el = $("toast");
    el.classList.remove("show");
    el.hidden = true;
  }

  function showModal(title, bodyHtml, btnText, onClick, extraClass) {
    modal.className = "modal" + (extraClass ? " " + extraClass : "");
    modal.innerHTML = "<h2>" + escapeHtml(title) + "</h2>" + bodyHtml +
      '<br><button type="button" class="btn btn-primary" id="modal-btn">' + escapeHtml(btnText) + "</button>";
    overlay.classList.remove("hidden");
    $("modal-btn").addEventListener("click", onClick);
  }

  function hideModal() {
    overlay.classList.add("hidden");
    modal.className = "modal";
    modal.innerHTML = "";
  }

  function showOpening() {
    const linesHtml =
      '<div class="opening-lines">' +
      OPENING_LINES.map(function (line) { return "<p>" + escapeHtml(line) + "</p>"; }).join("") +
      "</div>";
    showModal(
      "出城",
      linesHtml,
      "上路",
      function () {
        hideModal();
        state.openingShown = true;
        state.mode = "map";
        renderMap();
      },
      "opening"
    );
  }

  function resetGame() {
    state.mode = "map";
    state.mapId = "forest";
    state.px = MAPS.forest.entrance.x;
    state.py = MAPS.forest.entrance.y;
    state.encounterDone = false;
    state.eliteDone = false;
    state.chapterClear = false;
    state.boughtBlade = false;
    state.hunterTalked = false;
    state.eliteIntroDone = false;
    state.townUnlocked = false;
    state.mountainUnlocked = false;
    state.silver = 0;
    state.exp = 0;
    state.party = baseParty();
    state.enemies = [];
    state.log = [];
    state.fightSize = 0;
    state.combatKind = null;
    updateTopbar();
    if (!state.openingShown) {
      showOpening();
    } else {
      renderMap();
    }
  }

  resetGame();
})();
</script>
</body>
</html>
