<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《江湖试炼》— 试玩原型</title>
<style>
  /* 《江湖试炼》视觉规范 · 来自 ui-wireframes/tokens.css */
  :root {
    --paper: #f3ead8;
    --paper-dark: #e6d9c2;
    --ink: #2a2420;
    --ink-muted: #6b5e52;
    --border: #8a7a68;
    --gold: #b8860b;
    --hp: #c44536;
    --hp-bg: #e8d4ce;
    --mp: #3d6b8c;
    --mp-bg: #d4e0e8;
    --encounter: #c44536;
    --obstacle: #5a6b4a;
    --walk: #f7f1e6;
    --player: #2a2420;
    --btn: #e8dcc8;
    --btn-hover: #dccfb8;
    --btn-primary: #5c4033;
    --btn-primary-text: #f3ead8;
    --btn-disabled: #cfc4b4;
    --log-bg: #ebe2d2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Sans SC", system-ui, sans-serif;
    background: #cfc4b4;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #app {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  .topbar .stats {
    font-size: 13px;
    color: var(--ink-muted);
  }
  .topbar .stats b { color: var(--gold); }
  .topbar .phase {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: 10px;
  }

  #view { min-height: 360px; }

  /* —— 按钮（tokens） —— */
  .btn {
    background: var(--btn);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn-primary {
    background: var(--btn-primary);
    color: var(--btn-primary-text);
    border-color: var(--btn-primary);
  }
  .btn-primary:hover:not(:disabled) {
    background: #4a3328;
    border-color: #4a3328;
  }
  .btn:disabled {
    background: var(--btn-disabled);
    color: var(--ink-muted);
    cursor: not-allowed;
  }

  /* —— 血条 / 内力条（tokens） —— */
  .bar {
    height: 8px;
    border-radius: 2px;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--hp-bg);
    flex: 1;
  }
  .bar.mp { background: var(--mp-bg); }
  .bar > i {
    display: block;
    height: 100%;
    background: var(--hp);
    transition: width 0.25s;
  }
  .bar.mp > i { background: var(--mp); }

  /* —— 地图格 5×5（tokens） —— */
  .cell {
    width: 56px;
    height: 56px;
    border: 1px solid var(--border);
    background: var(--walk);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: default;
    user-select: none;
  }
  .cell.obstacle { background: #d5dbc8; color: var(--obstacle); }
  .cell.encounter { background: #f0d4ce; color: var(--encounter); font-weight: 700; }
  .cell.encounter.done { background: var(--walk); color: var(--ink-muted); font-weight: 400; opacity: 0.85; }
  .cell.player { background: var(--paper-dark); color: var(--player); font-weight: 700; }
  .cell.walk.adjacent {
    cursor: pointer;
    box-shadow: inset 0 0 0 2px var(--border);
  }
  .cell.walk.adjacent:hover { background: var(--paper-dark); }

  /* —— 探索 —— */
  .map-wrap { text-align: center; }
  .legend {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.7;
    margin-bottom: 8px;
    text-align: left;
  }
  .legend span { margin-right: 10px; }
  .map {
    display: grid;
    grid-template-columns: repeat(5, 56px);
    gap: 0;
    margin: 0 auto 12px;
    width: fit-content;
    border: 2px solid var(--border);
  }
  .hint {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 4px;
  }

  /* —— 战斗 —— */
  .combat { display: flex; flex-direction: column; gap: 10px; }
  .turn {
    font-size: 13px;
    margin-bottom: 2px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .side h2 {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .unit {
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: default;
  }
  .unit.active { outline: 2px solid var(--btn-primary); }
  .unit.selectable { cursor: pointer; outline: 1px dashed var(--border); }
  .unit.selectable:hover { background: #ddd2bc; }
  .unit.down { opacity: 0.45; filter: grayscale(0.5); }
  .unit .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .unit .name .role {
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-muted);
    margin-left: 6px;
  }
  .unit .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 11px;
    color: var(--ink-muted);
  }
  .unit .row .bar { flex: 1; }
  .unit .meta {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .log {
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    height: 88px;
    overflow: auto;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink);
  }
  .log p { margin: 0; }
  .log .sys, .log .dim { color: var(--ink-muted); }
  .log .dmg { color: var(--hp); }
  .log .heal { color: var(--mp); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    min-height: 36px;
  }
  .actions .hint-inline {
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: auto;
  }
  .prompt {
    width: 100%;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(90, 74, 58, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--paper);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 24px 28px;
    text-align: center;
    max-width: 360px;
  }
  .modal h2 {
    font-size: 1.25rem;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    color: var(--hp);
  }
  .modal p { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.6; }
  .modal .reward { color: var(--gold); font-weight: 700; }
  .modal .btn { margin-top: 12px; }
</style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <h1>江湖试炼</h1>
      <div class="stats">
        银两 <b id="silver">0</b>　经验 <b id="exp">0</b>
        <span class="phase" id="phase-label">探索</span>
      </div>
    </div>
    <div id="view"></div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal" id="modal"></div>
  </div>

<script>
(function () {
  "use strict";

  // ——— 数据 ———
  const MAP_SIZE = 5;
  const PLAYER_START = { x: 2, y: 4 };
  const ENCOUNTER = { x: 2, y: 1 }; // 触发战斗的格子（只打一次）

  // 不可走：边角树丛
  const BLOCKED = new Set(["0,0", "4,0", "0,4", "4,4", "1,0", "3,0"]);

  function baseParty() {
    return [
      {
        id: "lu",
        name: "陆沉舟",
        role: "剑客",
        maxHp: 100, hp: 100,
        maxMp: 30, mp: 30,
        atk: 22, spd: 14,
        skill: { name: "破军斩", cost: 12, desc: "高伤害单体" },
      },
      {
        id: "su",
        name: "苏晚晴",
        role: "医者",
        maxHp: 80, hp: 80,
        maxMp: 40, mp: 40,
        atk: 12, spd: 12,
        skill: { name: "回春", cost: 15, desc: "治疗一名友方" },
      },
      {
        id: "tie",
        name: "铁无声",
        role: "保镖",
        maxHp: 120, hp: 120,
        maxMp: 25, mp: 25,
        atk: 18, spd: 8,
        skill: { name: "横扫", cost: 14, desc: "攻击全体敌人" },
      },
    ];
  }

  function makeBandits(count) {
    const names = ["山贼甲", "山贼乙", "山贼丙"];
    const list = [];
    for (let i = 0; i < count; i++) {
      list.push({
        id: "bandit" + i,
        name: names[i] || "山贼",
        role: "匪徒",
        maxHp: 70 + i * 10, hp: 70 + i * 10,
        maxMp: 0, mp: 0,
        atk: 14 + i * 2, spd: 10 - i,
        isEnemy: true,
      });
    }
    return list;
  }

  // ——— 状态 ———
  const state = {
    mode: "map", // map | combat | result
    px: PLAYER_START.x,
    py: PLAYER_START.y,
    encounterDone: false,
    silver: 0,
    exp: 0,
    party: baseParty(),
    // combat
    enemies: [],
    turnQueue: [],
    turnIndex: 0,
    combatPhase: null, // pickAlly | pickAction | pickTarget | enemyTurn | wait
    actingAlly: null,
    pendingAction: null, // 'attack' | 'skill'
    log: [],
  };

  const view = document.getElementById("view");
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");

  function $(id) { return document.getElementById(id); }

  function updateTopbar() {
    $("silver").textContent = state.silver;
    $("exp").textContent = state.exp;
    $("phase-label").textContent =
      state.mode === "map" ? "探索" :
      state.mode === "combat" ? "战斗" : "结算";
  }

  function key(x, y) { return x + "," + y; }

  function isWalkable(x, y) {
    if (x < 0 || y < 0 || x >= MAP_SIZE || y >= MAP_SIZE) return false;
    return !BLOCKED.has(key(x, y));
  }

  function isAdjacent(x, y) {
    const dx = Math.abs(x - state.px);
    const dy = Math.abs(y - state.py);
    return (dx + dy === 1) && isWalkable(x, y);
  }

  // ——— 地图 ———
  function renderMap() {
    updateTopbar();
    let html = '<div class="map-wrap">';
    html += '<div class="legend">';
    html += '<span>· 可行走</span>';
    html += '<span>🌲 障碍</span>';
    html += '<span style="color:var(--encounter)">⚔️ 遇敌</span>';
    html += '<span>🚶 角色</span>';
    html += '</div>';
    html += '<div class="map" aria-label="5x5 map">';
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const classes = ["cell"];
        const isPlayer = x === state.px && y === state.py;
        const isEnc = x === ENCOUNTER.x && y === ENCOUNTER.y;
        if (!isWalkable(x, y)) {
          classes.push("obstacle");
        } else {
          classes.push("walk");
          if (isAdjacent(x, y)) classes.push("adjacent");
          if (isEnc) {
            classes.push("encounter");
            if (state.encounterDone) classes.push("done");
          }
        }
        if (isPlayer) classes.push("player");

        let icon = "";
        if (!isWalkable(x, y)) icon = "🌲";
        else if (isPlayer) icon = "🚶";
        else if (isEnc && !state.encounterDone) icon = "⚔️";
        else if (isEnc && state.encounterDone) icon = "✓";
        else icon = "·";

        html += `<div class="${classes.join(" ")}" data-x="${x}" data-y="${y}">${icon}</div>`;
      }
    }
    html += "</div>";
    html += '<p class="hint">点击相邻格移动 · 赤色遇敌格一战定音</p>';
    if (state.encounterDone) {
      html += '<p class="hint" style="margin-top:8px">山贼已除。可继续闲逛，或刷新页面重开。</p>';
    }
    html += "</div>";
    view.innerHTML = html;

    view.querySelectorAll(".cell.adjacent").forEach((el) => {
      el.addEventListener("click", () => {
        const x = +el.dataset.x;
        const y = +el.dataset.y;
        moveTo(x, y);
      });
    });
  }

  function moveTo(x, y) {
    if (!isAdjacent(x, y)) return;
    state.px = x;
    state.py = y;
    if (
      x === ENCOUNTER.x &&
      y === ENCOUNTER.y &&
      !state.encounterDone
    ) {
      startCombat();
      return;
    }
    renderMap();
  }

  // ——— 战斗 ———
  function startCombat() {
    // 开战前恢复一点，但保留探索损伤（本原型探索无伤，开战满状态更清晰）
    state.party = baseParty();
    const n = Math.random() < 0.5 ? 1 : 2;
    state.enemies = makeBandits(n);
    state.log = [];
    state.mode = "combat";
    state.combatPhase = "wait";
    pushLog("sys", "山贼拦路！拔剑迎战！");
    buildTurnQueue();
    renderCombat();
    setTimeout(nextTurn, 400);
  }

  function alive(u) { return u && u.hp > 0; }

  function buildTurnQueue() {
    const all = [...state.party, ...state.enemies].filter(alive);
    all.sort((a, b) => b.spd - a.spd || a.name.localeCompare(b.name, "zh"));
    state.turnQueue = all.map((u) => u.id);
    state.turnIndex = 0;
  }

  function findUnit(id) {
    return (
      state.party.find((p) => p.id === id) ||
      state.enemies.find((e) => e.id === id)
    );
  }

  function currentActor() {
    if (!state.turnQueue.length) return null;
    const id = state.turnQueue[state.turnIndex % state.turnQueue.length];
    return findUnit(id);
  }

  function advanceTurnIndex() {
    // 跳过已倒下的
    const len = state.turnQueue.length;
    for (let i = 0; i < len; i++) {
      state.turnIndex = (state.turnIndex + 1) % len;
      const u = findUnit(state.turnQueue[state.turnIndex]);
      if (alive(u)) return;
    }
  }

  function checkEnd() {
    const partyAlive = state.party.some(alive);
    const enemyAlive = state.enemies.some(alive);
    if (!enemyAlive) {
      endCombat(true);
      return true;
    }
    if (!partyAlive) {
      endCombat(false);
      return true;
    }
    return false;
  }

  function nextTurn() {
    if (state.mode !== "combat") return;
    if (checkEnd()) return;

    // 重建队列若有单位倒下（简化：每回合开始时若当前死了就跳）
    let actor = currentActor();
    let guard = 0;
    while (actor && !alive(actor) && guard < 20) {
      advanceTurnIndex();
      actor = currentActor();
      guard++;
    }
    if (!actor || !alive(actor)) {
      buildTurnQueue();
      actor = currentActor();
    }
    if (!actor) return;

    if (actor.isEnemy) {
      state.combatPhase = "enemyTurn";
      state.actingAlly = null;
      renderCombat();
      setTimeout(() => enemyAct(actor), 600);
    } else {
      // 玩家选择：速度决定顺序；到谁谁动
      state.actingAlly = actor;
      state.combatPhase = "pickAction";
      state.pendingAction = null;
      pushLog("sys", `轮到 ${actor.name}（${actor.role}）`);
      renderCombat();
    }
  }

  function enemyAct(enemy) {
    if (state.mode !== "combat" || !alive(enemy)) {
      finishActorTurn();
      return;
    }
    const targets = state.party.filter(alive);
    if (!targets.length) {
      finishActorTurn();
      return;
    }
    // 打血最少的
    targets.sort((a, b) => a.hp - b.hp);
    const t = targets[0];
    const dmg = Math.max(1, enemy.atk + rand(-3, 3));
    t.hp = Math.max(0, t.hp - dmg);
    pushLog("dmg", `${enemy.name} 挥刀砍向 ${t.name}，造成 ${dmg} 伤害！`);
    if (t.hp <= 0) pushLog("sys", `${t.name} 力竭倒下……`);
    renderCombat();
    setTimeout(finishActorTurn, 500);
  }

  function finishActorTurn() {
    if (checkEnd()) return;
    advanceTurnIndex();
    // 若一整圈后刷新队列（处理死亡）
    const still = state.turnQueue.some((id) => alive(findUnit(id)));
    if (!still) {
      buildTurnQueue();
    }
    setTimeout(nextTurn, 350);
  }

  function rand(a, b) {
    return a + Math.floor(Math.random() * (b - a + 1));
  }

  function doAttack(attacker, target) {
    const dmg = Math.max(1, attacker.atk + rand(-2, 4));
    target.hp = Math.max(0, target.hp - dmg);
    pushLog("dmg", `${attacker.name} 普通攻击 ${target.name}，造成 ${dmg} 伤害！`);
    if (target.hp <= 0) pushLog("sys", `${target.name} 倒下了！`);
  }

  function doSkill(attacker, targetOrNull) {
    const sk = attacker.skill;
    if (attacker.mp < sk.cost) {
      pushLog("sys", `${attacker.name} 内力不足，无法施展「${sk.name}」！`);
      return false;
    }
    attacker.mp -= sk.cost;

    if (attacker.id === "lu") {
      // 破军斩
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const dmg = Math.max(1, Math.floor(attacker.atk * 1.8) + rand(2, 8));
      t.hp = Math.max(0, t.hp - dmg);
      pushLog("dmg", `${attacker.name} 施展「破军斩」！${t.name} 受到 ${dmg} 重创！`);
      if (t.hp <= 0) pushLog("sys", `${t.name} 倒下了！`);
    } else if (attacker.id === "su") {
      // 回春
      const t = targetOrNull;
      if (!t || !alive(t)) return false;
      const heal = 28 + rand(0, 10);
      t.hp = Math.min(t.maxHp, t.hp + heal);
      pushLog("heal", `${attacker.name} 施展「回春」，为 ${t.name} 回复 ${heal} 气血！`);
    } else if (attacker.id === "tie") {
      // 横扫
      const foes = state.enemies.filter(alive);
      if (!foes.length) return false;
      pushLog("dmg", `${attacker.name} 施展「横扫」！`);
      foes.forEach((t) => {
        const dmg = Math.max(1, Math.floor(attacker.atk * 0.75) + rand(0, 4));
        t.hp = Math.max(0, t.hp - dmg);
        pushLog("dmg", `　→ ${t.name} 受到 ${dmg} 伤害`);
        if (t.hp <= 0) pushLog("sys", `${t.name} 倒下了！`);
      });
    }
    return true;
  }

  function pushLog(cls, text) {
    state.log.push({ cls, text });
    if (state.log.length > 40) state.log.shift();
  }

  function renderCombat() {
    updateTopbar();
    const actor = state.actingAlly || (state.combatPhase === "enemyTurn" ? currentActor() : null);

    let html = '<div class="combat">';
    if (state.actingAlly && alive(state.actingAlly) && state.combatPhase === "pickAction") {
      html += `<div class="turn">${escapeHtml(state.actingAlly.name)} 的回合 · 选动作后点选一个目标</div>`;
    } else if (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") {
      html += `<div class="turn">点选一个敌人</div>`;
    } else if (state.combatPhase === "pickTargetHeal") {
      html += `<div class="turn">点选一名友方治疗</div>`;
    } else if (state.combatPhase === "enemyTurn" && actor) {
      html += `<div class="turn">${escapeHtml(actor.name)} 行动中……</div>`;
    } else {
      html += `<div class="turn">遭遇战</div>`;
    }

    html += '<div class="stage">';

    // 我方
    html += '<div class="side"><h2>我方</h2>';
    state.party.forEach((p) => {
      const cls = ["unit"];
      if (!alive(p)) cls.push("down");
      if (actor && actor.id === p.id) cls.push("active");
      if (state.combatPhase === "pickTargetHeal" && alive(p)) cls.push("selectable");
      html += unitCard(p, cls.join(" "), false);
    });
    html += "</div>";

    // 敌方
    html += '<div class="side"><h2>敌方</h2>';
    state.enemies.forEach((e) => {
      const cls = ["unit"];
      if (!alive(e)) cls.push("down");
      if (actor && actor.id === e.id) cls.push("active");
      if (
        (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") &&
        alive(e)
      ) {
        cls.push("selectable");
      }
      html += unitCard(e, cls.join(" "), true);
    });
    html += "</div></div>";

    // log
    html += '<div class="log" id="combat-log">';
    state.log.forEach((l) => {
      html += `<p class="${l.cls}">${escapeHtml(l.text)}</p>`;
    });
    html += "</div>";

    // actions
    html += '<div class="actions" id="combat-actions">';
    if (state.combatPhase === "pickAction" && state.actingAlly && alive(state.actingAlly)) {
      const a = state.actingAlly;
      html += `<button type="button" class="btn btn-primary" id="btn-atk">普攻</button>`;
      const canSkill = a.mp >= a.skill.cost;
      html += `<button type="button" class="btn" id="btn-skill" ${canSkill ? "" : "disabled"}>技能 · ${a.skill.name}（${a.skill.cost}）</button>`;
      html += `<span class="hint-inline">${escapeHtml(a.skill.desc)}</span>`;
    } else if (state.combatPhase === "pickTarget" || state.combatPhase === "pickTargetSkill") {
      html += `<span class="hint-inline" style="margin-left:0">点选一个敌人</span>`;
      html += `<button type="button" class="btn" id="btn-cancel">取消</button>`;
    } else if (state.combatPhase === "pickTargetHeal") {
      html += `<span class="hint-inline" style="margin-left:0">点选一名友方</span>`;
      html += `<button type="button" class="btn" id="btn-cancel">取消</button>`;
    } else if (state.combatPhase === "enemyTurn") {
      html += `<span class="hint-inline" style="margin-left:0">敌方行动中……</span>`;
    }
    html += "</div></div>";

    view.innerHTML = html;
    const logEl = $("combat-log");
    if (logEl) logEl.scrollTop = logEl.scrollHeight;

    bindCombatEvents();
  }

  function unitCard(u, cls, isEnemy) {
    const hpPct = Math.max(0, (u.hp / u.maxHp) * 100);
    const mpPct = u.maxMp ? Math.max(0, (u.mp / u.maxMp) * 100) : 0;
    let html = `<div class="${cls}" data-id="${u.id}">`;
    html += `<div class="name">${escapeHtml(u.name)}<span class="role">${escapeHtml(u.role)}</span></div>`;
    html += `<div class="row">气血 <div class="bar"><i style="width:${hpPct}%"></i></div> ${u.hp}/${u.maxHp}</div>`;
    if (!isEnemy) {
      html += `<div class="row">内力 <div class="bar mp"><i style="width:${mpPct}%"></i></div> ${u.mp}/${u.maxMp}</div>`;
    }
    html += `<div class="meta">攻 ${u.atk} · 速 ${u.spd}</div>`;
    html += "</div>";
    return html;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function bindCombatEvents() {
    const btnAtk = $("btn-atk");
    const btnSkill = $("btn-skill");
    const btnCancel = $("btn-cancel");

    if (btnAtk) {
      btnAtk.addEventListener("click", () => {
        state.pendingAction = "attack";
        state.combatPhase = "pickTarget";
        renderCombat();
      });
    }
    if (btnSkill) {
      btnSkill.addEventListener("click", () => {
        const a = state.actingAlly;
        if (!a) return;
        state.pendingAction = "skill";
        if (a.id === "su") {
          state.combatPhase = "pickTargetHeal";
        } else if (a.id === "tie") {
          // 横扫无需选目标
          const ok = doSkill(a, null);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
          return;
        } else {
          state.combatPhase = "pickTargetSkill";
        }
        renderCombat();
      });
    }
    if (btnCancel) {
      btnCancel.addEventListener("click", () => {
        state.pendingAction = null;
        state.combatPhase = "pickAction";
        renderCombat();
      });
    }

    view.querySelectorAll(".unit.selectable").forEach((el) => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        const a = state.actingAlly;
        if (!a) return;

        if (state.combatPhase === "pickTarget") {
          const t = state.enemies.find((e) => e.id === id);
          if (!t || !alive(t)) return;
          doAttack(a, t);
          renderCombat();
          setTimeout(finishActorTurn, 450);
        } else if (state.combatPhase === "pickTargetSkill") {
          const t = state.enemies.find((e) => e.id === id);
          if (!t || !alive(t)) return;
          const ok = doSkill(a, t);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
        } else if (state.combatPhase === "pickTargetHeal") {
          const t = state.party.find((p) => p.id === id);
          if (!t || !alive(t)) return;
          const ok = doSkill(a, t);
          renderCombat();
          if (ok) setTimeout(finishActorTurn, 450);
          else {
            state.combatPhase = "pickAction";
            renderCombat();
          }
        }
      });
    });
  }

  function endCombat(won) {
    state.mode = "result";
    state.combatPhase = null;
    if (won) {
      state.encounterDone = true;
      const silverGain = 30 + rand(10, 40);
      const expGain = 50 + rand(10, 30);
      state.silver += silverGain;
      state.exp += expGain;
      updateTopbar();
      showModal(
        "胜利",
        `<p>山贼溃逃，道路重开。</p>
         <p class="reward">获得银两 +${silverGain}　经验 +${expGain}</p>
         <p>当前银两 ${state.silver} · 经验 ${state.exp}</p>`,
        "返回地图",
        () => {
          hideModal();
          state.mode = "map";
          renderMap();
        }
      );
    } else {
      showModal(
        "败北",
        `<p>全员力竭……江湖路远，再试一次。</p>`,
        "重新开始",
        () => {
          hideModal();
          resetGame();
        }
      );
    }
  }

  function showModal(title, bodyHtml, btnText, onClick) {
    modal.innerHTML = `<h2>${escapeHtml(title)}</h2>${bodyHtml}<br><button type="button" class="btn btn-primary" id="modal-btn">${escapeHtml(btnText)}</button>`;
    overlay.classList.remove("hidden");
    $("modal-btn").addEventListener("click", onClick);
  }

  function hideModal() {
    overlay.classList.add("hidden");
    modal.innerHTML = "";
  }

  function resetGame() {
    state.mode = "map";
    state.px = PLAYER_START.x;
    state.py = PLAYER_START.y;
    state.encounterDone = false;
    state.silver = 0;
    state.exp = 0;
    state.party = baseParty();
    state.enemies = [];
    state.log = [];
    updateTopbar();
    renderMap();
  }

  // 启动
  resetGame();
})();
</script>
</body>
</html>
